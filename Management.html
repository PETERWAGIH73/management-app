      const bStats = itemStats(bFrom, bTo);

      return `
        <h2>تقرير الأصناف</h2>
        <datalist id="itemNameList">
          ${itemNames().map(name => `<option value="${name}">`).join("")}
        </datalist>

        <div class="grid">
          <label>التاريخ ${dateBox("itd", r.date || rememberedDate("itd"))}</label>
          <label>اسم الصنف <input id="itn" list="itemNameList" value="${r.name || ""}" placeholder="اكتب أول حرف"></label>
          <label>عدد القطع المباعة <input id="itq" type="number" step="0.01" value="${r.qty || ""}"></label>
          <label>سعر القطع المباعة <input id="itv" type="number" step="0.01" value="${r.value || ""}"></label>
          <button onclick="saveItem()">${r.id ? "تعديل الصنف" : "إضافة صنف"}</button>
          ${r.id ? `<button class="light" onclick="edit=null; draw()">إلغاء التعديل</button>` : ""}
        </div>

        <div class="row">
          <button class="gray" onclick="box('itemsList')">عرض / إخفاء الأصناف المسجلة</button>
        </div>

        <div id="itemsList" style="display:none">
          <div class="table-scroll">
            ${table(
              fl(st().items),
              "items",
              ["التاريخ", "الصنف", "عدد القطع", "سعر القطع"],
              x => [x.date, x.name, m(x.qty), m(x.value)]
            )}
          </div>
        </div>

        <hr>

        <h3>الرسم البياني للفترة المحددة فوق</h3>
        <div class="cards">
          <div class="card">إجمالي القطع <strong>${m(mainStats.totalQty)}</strong></div>
          <div class="card">إجمالي سعر القطع <strong>${m(mainStats.totalValue)}</strong></div>
        </div>
        ${pieChart(mainStats)}
        ${itemStatsTable(mainStats)}

        <hr>

        <h3>مقارنة بين فترتين</h3>
        <div class="grid">
          <label>الفترة الأولى من ${dateBox("iaf", aFrom)}</label>
          <label>الفترة الأولى إلى ${dateBox("iat", aTo)}</label>
          <label>الفترة الثانية من ${dateBox("ibf", bFrom)}</label>
          <label>الفترة الثانية إلى ${dateBox("ibt", bTo)}</label>
          <button onclick="setItemCompare()">تطبيق المقارنة</button>
        </div>

        <div class="cards">
          <div class="card">قطع الفترة الأولى <strong>${m(aStats.totalQty)}</strong></div>
          <div class="card">قيمة الفترة الأولى <strong>${m(aStats.totalValue)}</strong></div>
          <div class="card">قطع الفترة الثانية <strong>${m(bStats.totalQty)}</strong></div>
          <div class="card">قيمة الفترة الثانية <strong>${m(bStats.totalValue)}</strong></div>
        </div>

        ${compareChart(aStats, bStats)}

        <div class="table-scroll">
          <table>
            <tr><th>الصنف</th><th>قطع الفترة الأولى</th><th>قطع الفترة الثانية</th><th>الفرق</th><th>قيمة الأولى</th><th>قيمة الثانية</th></tr>
            ${itemCompareRows(aStats, bStats)}
          </table>
        </div>
      `;
    }

    // حفظ صنف مباع.
    function saveItem() {
      if (!itn.value.trim()) return alert("اكتب اسم الصنف");

      up(st().items, {
        id: edit?.type === "items" ? edit.id : id(),
        date: dateValue("itd"),
        name: itn.value.trim(),
        qty: n(itq.value),
        value: n(itv.value)
      });
    }

    // حفظ فترتي المقارنة في ذاكرة الجلسة.
    function setItemCompare() {
      sessionStorage.itemsAFrom = dateValue("iaf");
      sessionStorage.itemsATo = dateValue("iat");
      sessionStorage.itemsBFrom = dateValue("ibf");
      sessionStorage.itemsBTo = dateValue("ibt");
      draw();
    }

    // صفوف جدول مقارنة الأصناف.
    function itemCompareRows(aStats, bStats) {
      const names = new Set([...aStats.list.map(x => x.name), ...bStats.list.map(x => x.name)]);
      const aMap = Object.fromEntries(aStats.list.map(x => [x.name, x]));
      const bMap = Object.fromEntries(bStats.list.map(x => [x.name, x]));

      return [...names].sort((a, b) => a.localeCompare(b, "ar")).map(name => {
        const a = aMap[name] || { qty: 0, value: 0 };
        const b = bMap[name] || { qty: 0, value: 0 };

        return `
          <tr>
            <td>${name}</td>
            <td>${m(a.qty)}</td>
            <td>${m(b.qty)}</td>
            <td>${m(b.qty - a.qty)}</td>
            <td>${m(a.value)}</td>
            <td>${m(b.value)}</td>
          </tr>
        `;
      }).join("") || `<tr><td colspan="6">لا توجد بيانات للمقارنة</td></tr>`;
    }

    /* =========================================================
       شيت المصروفات والمسحوبات
       ========================================================= */

    // رسم المصروفات وسلف البائعين.
    function expenses() {
      const expenseRecord = edit?.type === "expenses" ? st().expenses.find(x => x.id === edit.id) : {};
      const withdrawalRecord = edit?.type === "withdrawals" ? st().withdrawals.find(x => x.id === edit.id) : {};
      const expenseList = fl(st().expenses);
      const withdrawalList = fl(st().withdrawals);
      const traderPaymentList = fl(st().traderTx).filter(x => x.kind === "payment");
      const unifiedList = unifiedOutflows();
      const allSellers = [
        ...st().sellers.map(s => ({ name: s.name, type: "عمولة" })),
        ...st().fixedSellers.map(s => ({ name: s.name, type: "راتب ثابت" }))
      ];

      return `
        <h2>المصروفات والمسحوبات</h2>
        <div class="card">إجمالي المصروفات <strong>${m(unifiedOutflowTotal())}</strong></div>

        <h3>مصروفات المحل</h3>
        <div class="grid">
          <label>التاريخ ${dateBox("xd", expenseRecord.date || rememberedDate("xd"))}</label>
          <label>البند <input id="xi" value="${expenseRecord.item || ""}"></label>
          <label>القيمة <input id="xa" type="number" step="0.01" value="${expenseRecord.amount || ""}"></label>
          <button onclick="saveExpense()">حفظ</button>
        </div>

        <div class="row">
          <button class="gray" onclick="box('explist')"> المصروفات</button>
          <div class="card">الإجمالي <strong>${m(expenseList.reduce((s, x) => s + n(x.amount), 0))}</strong></div>
        </div>

        <div id="explist" style="display:none">
          <div class="table-scroll">
            ${table(expenseList, "expenses", ["التاريخ", "البند", "القيمة"], x => [x.date, x.item, m(x.amount)])}
          </div>
        </div>

        <hr>

        <h3>كشف المصروفات </h3>
        <p>التفاصيل الكاملة للمصروفات</p>
        <div class="row">
          <button class="gray" onclick="box('unifiedlist')">التفاصيل</button>
          <button onclick="exportExpensesPdf()">PDF</button>
          <div class="card">مصروفات كاش <strong>${m(expenseList.reduce((s, x) => s + n(x.amount), 0))}</strong></div>
          <div class="card">دفعات التجار <strong>${m(traderPaymentList.reduce((s, x) => s + n(x.amount), 0))}</strong></div>
          <div class="card">مسحوبات البائعين <strong>${m(withdrawalList.reduce((s, x) => s + n(x.amount), 0))}</strong></div>
        </div>
        <div id="unifiedlist" style="display:none">
          <div class="table-scroll">
            <table>
              <tr><th>التاريخ</th><th>البند</th><th>النوع</th><th>القيمة</th><th>المصدر</th><th>تعديل</th></tr>
              ${unifiedList.map(x => `
                <tr>
                  <td>${x.date}</td><td>${x.item}</td><td>${x.type}</td><td>${m(x.amount)}</td>
                  <td>${x.source === "expenses" ? "المصروفات" : x.source === "traderTx" ? "التجار" : "مسحوبات البائعين"}</td>
                  <td><button class="light" onclick="edt('${x.source}','${x.id}')">تعديل</button><button class="danger" onclick="del('${x.source}','${x.id}')">حذف</button></td>
                </tr>
              `).join("") || `<tr><td colspan="6">لا توجد عمليات خلال الفترة</td></tr>`}
            </table>
          </div>
        </div>

        <hr>

        <h3>مسحوبات البائعين</h3>
        <div class="grid">
          <label>التاريخ ${dateBox("wd", withdrawalRecord.date || rememberedDate("wd"))}</label>
          <label>
            البائع
            <select id="ws">
              ${allSellers.map(s => `<option value="${s.name}" ${withdrawalRecord.seller === s.name ? "selected" : ""}>${s.name} - ${s.type}</option>`).join("")}
            </select>
          </label>
          <label>القيمة <input id="wa" type="number" step="0.01" value="${withdrawalRecord.amount || ""}"></label>
          <button onclick="saveWithdrawal()">حفظ</button>
        </div>

        <div class="row">
          <button class="gray" onclick="box('wdlist')">المسحوبات</button>
          <div class="card">الإجمالي <strong>${m(withdrawalList.reduce((s, x) => s + n(x.amount), 0))}</strong></div>
        </div>

        <div id="wdlist" style="display:none">
          <div class="table-scroll">
            ${table(withdrawalList, "withdrawals", ["التاريخ", "البائع", "القيمة"], x => [x.date, x.seller, m(x.amount)])}
          </div>
        </div>
      `;
    }

    // حفظ مصروف.
    function saveExpense() {
      if (!xi.value.trim()) return alert("اكتب البند");

      up(st().expenses, {
        id: edit?.type === "expenses" ? edit.id : id(),
        date: dateValue("xd"),
        item: xi.value.trim(),
        amount: n(xa.value)
      });
    }

    // حفظ سلفة أو مسحوبات بائع.
    function saveWithdrawal() {
      if (!st().sellers.length && !st().fixedSellers.length) return alert("أضف بائع الأول");

      up(st().withdrawals, {
        id: edit?.type === "withdrawals" ? edit.id : id(),
        date: dateValue("wd"),
        seller: ws.value,
        amount: n(wa.value)
      });
    }

    /* =========================================================
       شيت توزيع الأرباح
       ========================================================= */

    // حساب بيانات تقرير الأرباح.
    function profitCalc() {
      const s = totals();
      const e = exStats();
      const visaDisc = s.visa * .03;
      const grossSalesEgp = s.egp + s.visa + (s.euro * e.eavg) + (s.dollar * e.davg) + (s.gbp * e.bavg);
      const salesEgp = grossSalesEgp - visaDisc;

      return {
        grossSalesEgp,
        salesEgp,
        visaDisc,
        normalExpenses: fl(st().expenses).reduce((a, x) => a + n(x.amount), 0),
        traderPayments: fl(st().traderTx).filter(x => x.kind === "payment").reduce((a, x) => a + n(x.amount), 0),
        sellerWithdrawals: fl(st().withdrawals).reduce((a, x) => a + n(x.amount), 0),
        expenses: unifiedOutflowTotal(),
        pieces: meta()[2] ? s.pieces : 0
      };
    }

    // تجميع السلف حسب نوع البائع حتى تُخصم من الراتب المتبقي، لا كتكلفة مكررة.
    function sellerAdvanceSummary() {
      const withdrawals = {};
      const commissionNames = new Set(st().sellers.map(x => x.name));
      const fixedNames = new Set(st().fixedSellers.map(x => x.name));
      let commissionAdvances = 0;
      let fixedAdvances = 0;

      fl(st().withdrawals).forEach(x => {
        const amount = n(x.amount);
        withdrawals[x.seller] = (withdrawals[x.seller] || 0) + amount;
        if (commissionNames.has(x.seller)) commissionAdvances += amount;
        if (fixedNames.has(x.seller)) fixedAdvances += amount;
      });

      return { withdrawals, commissionAdvances, fixedAdvances };
    }

    // رسم تقرير الأرباح والشركاء.
    function profits() {
      const p = profitCalc();
      const commission = n(sessionStorage["comm" + store]);
      const salaryBase = Math.max(0, p.salesEgp - p.pieces);
      const salariesTotal = salaryBase * commission / 100;
      const fixedSalariesTotal = st().fixedSellers.reduce((sum, x) => sum + n(x.salary), 0);
      const eachSalary = st().sellers.length ? salariesTotal / st().sellers.length : 0;
      const advanceSummary = sellerAdvanceSummary();
      const salariesAfterAdvances = Math.max(0, salariesTotal - advanceSummary.commissionAdvances);
      const fixedSalariesAfterAdvances = Math.max(0, fixedSalariesTotal - advanceSummary.fixedAdvances);
      const netProfit = p.salesEgp - (salariesAfterAdvances + fixedSalariesAfterAdvances + p.expenses);
      const partnersPercent = st().partners.reduce((s, x) => s + n(x.percent), 0);
      const withdrawals = advanceSummary.withdrawals;

      return `
        <h2>توزيع الأرباح وإضافة شركاء</h2>

        <div class="grid grid3">
          <label>اسم الشريك <input id="pn"></label>
          <label>النسبة % <input id="pp" type="number" step="0.01"></label>
          <button onclick="addPartner()">إضافة شريك</button>
        </div>

        <div class="row">
          <button class="gray" onclick="box('plist')">الشركاء</button>
          <b class="${partnersPercent === 100 ? "ok" : "bad"}">إجمالي النسب: ${m(partnersPercent)}%</b>
        </div>

        <div id="plist" style="display:none">
          <div class="table-scroll">
            ${table(st().partners, "partners", ["الشريك", "النسبة"], x => [x.name, m(x.percent) + "%"])}
          </div>
        </div>

        <hr>

        <div class="grid grid3">
          <label>نسبة عمولة البائعين % <input id="cm" type="number" step="0.01" value="${commission || ""}"></label>
          <button onclick="sessionStorage['comm'+store]=cm.value; draw()">تحديث التقرير</button>
          <button class="gray" onclick="exportProfitPdf()">تصدير PDF</button>
        </div>

        <div class="cards">
          <div class="card">اجمالي المبيعات الكلي <strong>${m(p.grossSalesEgp)}</strong></div>
          <div class="card">خصم الفيزا 3% <strong>${m(p.visaDisc)}</strong></div>
          <div class="card">صافي المبيعات بعد خصم ال3% <strong>${m(p.salesEgp)}</strong></div>
          <div class="card">إجمالي المصروفات <strong>${m(p.expenses)}</strong></div>
          <div class="card">مصروفات كاش <strong>${m(p.normalExpenses)}</strong></div>
          <div class="card">دفعات التجار <strong>${m(p.traderPayments)}</strong></div>
          <div class="card">مسحوبات البائعين <strong>${m(p.sellerWithdrawals)}</strong></div>
          <div class="card">إجمالي مرتبات البائعين <strong>${m(salariesTotal)}</strong></div>
          <div class="card">إجمالي الرواتب الثابتة <strong>${m(fixedSalariesTotal)}</strong></div>
          ${meta()[2] ? `<div class="card">سعر القطع المستبعد <strong>${m(p.pieces)}</strong></div>` : ""}
          <div class="card">صافي ربح الشركاء <strong>${m(netProfit)}</strong></div>
        </div>

        <h3>مرتبات البائعين</h3>
        <div class="table-scroll">
          <table>
            <tr><th>البائع</th><th>المستحق</th><th>المسحوبات</th><th>الفعلي</th></tr>
            ${
              st().sellers.map(s => `
                <tr>
                  <td>${s.name}</td>
                  <td>${m(eachSalary)}</td>
                  <td>${m(withdrawals[s.name] || 0)}</td>
                  <td>${m(eachSalary - (withdrawals[s.name] || 0))}</td>
                </tr>
              `).join("") || `<tr><td colspan="4">لا يوجد بائعين</td></tr>`
            }
          </table>
        </div>

        <h3>رواتب ثابتة</h3>
        <div class="table-scroll">
          <table>
            <tr><th>الأسم</th><th>الراتب الثابت</th><th>المسحوبات</th><th>الصافي</th></tr>
            ${
              st().fixedSellers.map(s => `
                <tr>
                  <td>${s.name}</td>
                  <td>${m(s.salary)}</td>
                  <td>${m(withdrawals[s.name] || 0)}</td>
                  <td>${m(n(s.salary) - (withdrawals[s.name] || 0))}</td>
                </tr>
              `).join("") || `<tr><td colspan="4">لا يوجد بائعين براتب ثابت</td></tr>`
            }
          </table>
        </div>

        <h3>أرباح الشركاء</h3>
        <div class="table-scroll">
          <table>
            <tr><th>الشريك</th><th>النسبة</th><th>الربح</th></tr>
            ${
              st().partners.map(x => `
                <tr>
                  <td>${x.name}</td>
                  <td>${m(x.percent)}%</td>
                  <td>${m(netProfit * n(x.percent) / 100)}</td>
                </tr>
              `).join("") || `<tr><td colspan="3">لا يوجد شركاء</td></tr>`
            }
          </table>
        </div>
      `;
    }

    // إضافة شريك بشرط ألا تتخطى النسب 100%.
    function addPartner() {
      const total = st().partners.reduce((s, x) => s + n(x.percent), 0);
      const percent = n(pp.value);

      if (!pn.value.trim() || percent <= 0) return alert("اكتب اسم الشريك ونسبته");
      if (total + percent > 100) return alert("إجمالي النسب لا يتخطى 100%");

      st().partners.push({ id: id(), name: pn.value.trim(), percent });
      save();
      draw();
    }

    /* =========================================================
       الجداول والتقارير والنسخ الاحتياطي
       ========================================================= */

    // دالة عامة لرسم جدول بأي بيانات ومعها أزرار تعديل وحذف.
    function table(list, type, heads, map) {
      return `
        <table>
          <tr>
            ${heads.map(h => `<th>${h}</th>`).join("")}
            <th>تحكم</th>
          </tr>
          ${
            list.map(x => `
              <tr>
                ${map(x).map(c => `<td>${c}</td>`).join("")}
                <td>
                  <button class="light" onclick="edt('${type}','${x.id}')">تعديل</button>
                  <button class="danger" onclick="del('${type}','${x.id}')">حذف</button>
                </td>
              </tr>
            `).join("") || `<tr><td colspan="${heads.length + 1}">لا توجد بيانات</td></tr>`
          }
        </table>
      `;
    }

    // المحلات المختارة في تقرير أرصدة التجار.
    function selectedTraderBalanceStoreIds() {
      const availableIds = stores.map(s => s[0]);
      try {
        const saved = JSON.parse(localStorage.managementTraderBalanceStores);
        if (Array.isArray(saved)) return new Set(saved.filter(id => availableIds.includes(id)));
      } catch (e) {}
      return new Set(availableIds);
    }

    function toggleTraderBalanceStore(storeId, checked) {
      const selected = selectedTraderBalanceStoreIds();
      if (checked) selected.add(storeId);
      else selected.delete(storeId);
      localStorage.managementTraderBalanceStores = JSON.stringify([...selected]);
      traderTotals();
    }

    function selectAllTraderBalanceStores() {
      localStorage.managementTraderBalanceStores = JSON.stringify(stores.map(s => s[0]));
      traderTotals();
    }

    // تقرير إجمالي أرصدة التجار في المحلات المختارة.
    function traderTotals() {
      const rows = {};
      let grand = 0;
      const selectedIds = selectedTraderBalanceStoreIds();
      const selectedStores = stores.filter(s => selectedIds.has(s[0]));

      selectedStores.forEach(s => {
        data.stores[s[0]].traderTx.forEach(t => {
          rows[t.name] ??= { total: 0, parts: {} };
          const value = t.kind === "invoice" ? n(t.amount) : -n(t.amount);
          rows[t.name].total += value;
          rows[t.name].parts[s[1]] = (rows[t.name].parts[s[1]] || 0) + value;
          grand += value;
        });
      });

      app.innerHTML = `
        <h1 class="title">MANAGEMENT</h1>
        <section class="panel">
          <h2>إجمالي الأرصدة للتجار</h2>
          <div class="row">
            <button class="gray" onclick="selectAllTraderBalanceStores()">اختيار كل المحلات</button>
            ${stores.map(s => `<label class="shop-choice"><input type="checkbox" ${selectedIds.has(s[0]) ? "checked" : ""} onchange="toggleTraderBalanceStore('${s[0]}', this.checked)">${s[1]}</label>`).join("")}
          </div>
          <div class="card">الإجمالي اللي عليك كله <strong>${m(grand)}</strong></div>
          <div class="table-scroll">
            <table>
              <tr><th>التاجر</th><th>تفصيل المحلات</th><th>الإجمالي</th></tr>
              ${
                Object.entries(rows).map(([name, value]) => `
                  <tr>
                    <td>${name}</td>
                    <td>${Object.entries(value.parts).map(([shop, total]) => `${shop}: ${m(total)}`).join(" | ")}</td>
                    <td>${m(value.total)}</td>
                  </tr>
                `).join("") || `<tr><td colspan="3">لا توجد أرصدة</td></tr>`
              }
            </table>
          </div>
        </section>
      `;
    }

    // تنزيل نسخة احتياطية من كل بيانات البرنامج.
    async function backup() {
      save();
      const file = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const fileName = "MANAGEMENT backup.json";

      // لو المتصفح بيدعم اختيار مكان الحفظ، هيفتح نافذة اختيار المكان.
      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: fileName,
            types: [{ description: "JSON Backup", accept: { "application/json": [".json"] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(file);
          await writable.close();
          alert("تم حفظ النسخة الاحتياطية");
          return;
        } catch (e) {
          if (e.name === "AbortError") return;
        }
      }

      // لو المتصفح لا يدعم اختيار المكان، يتم التنزيل بالطريقة العادية.
      const link = document.createElement("a");
      link.href = URL.createObjectURL(file);
      link.download = fileName;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    // استرجاع بيانات البرنامج من ملف نسخة احتياطية.
    function restore(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          data = JSON.parse(reader.result);
          data.customStores ||= [];
          data.viewMode ||= "desktop";
          syncCustomStores();
          stores.forEach(s => { data.stores[s[0]] ||= blank(); });
          save();
          applyViewMode();
          alert("تم الاسترجاع");
          home();
        } catch (x) {
          alert("ملف غير صالح");
        }
      };
      reader.readAsText(file);
    }

    // حذف كل البيانات بعد تأكيدين.
    function clearAllData() {
      if (!confirm("متأكد إنك عايز تحذف كل بيانات البرنامج؟")) return;
      if (!confirm("آخر تأكيد: الحذف نهائي إلا لو عندك نسخة احتياطية.")) return;

      data = {
        traders: [],
        customStores: data.customStores || [],
        deletedStoreIds: data.deletedStoreIds || [],
        viewMode: data.viewMode || "desktop",
        stores: Object.fromEntries(stores.map(s => [s[0], blank()]))
      };

      save();
      alert("تم حذف كل البيانات");
      home();
    }

    // قالب موحد لتقارير PDF: يفتح نافذة طباعة يمكن منها اختيار "حفظ كـ PDF".
    function printPdf(title, subtitle, content, orientation = "portrait") {
      const printWindow = window.open("", "_blank");
      if (!printWindow) return alert("اسمح بفتح نافذة الطباعة لتصدير PDF");

      printWindow.document.write(`
        <!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${title}</title>
        <style>
          @page{size:A4 ${orientation};margin:14mm 12mm 16mm}
          *{box-sizing:border-box} body{font-family:Tahoma,Arial,sans-serif;color:#142033;margin:0;font-size:12px;line-height:1.55}
          .report-head{border-bottom:3px solid #17808b;padding:0 0 12px;margin-bottom:18px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
          h1{font-size:24px;margin:0;color:#0b1220} h2{font-size:16px;color:#123b52;margin:22px 0 8px;border-right:4px solid #22a6b3;padding-right:8px}
          .brand{font-weight:900;letter-spacing:.6px;color:#17808b}.meta{margin:4px 0 0;color:#52677d}.stamp{color:#6a7d91;font-size:10px;text-align:left}
          .summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:10px 0 18px}.metric{border:1px solid #d5e1e8;border-radius:7px;padding:9px 11px;background:#f5f9fb}.metric b{display:block;font-size:15px;color:#0b1220;margin-top:3px}
          table{width:100%;border-collapse:collapse;margin:8px 0 18px;page-break-inside:auto}tr{page-break-inside:avoid}th,td{border:1px solid #cddae2;padding:7px 8px;text-align:right}th{background:#123b52;color:#fff;font-size:11px}tbody tr:nth-child(even) td{background:#f5f8fa}.total td{font-weight:900;background:#dff3f4!important}.tag{display:inline-block;padding:2px 7px;border-radius:9px;background:#e4f0f6;color:#123b52;font-weight:700;font-size:10px}
          .footer{position:fixed;bottom:-9mm;left:0;right:0;border-top:1px solid #d5e1e8;padding-top:3px;color:#6a7d91;font-size:9px;display:flex;justify-content:space-between}
          @media print{.footer:after{content:"MANAGEMENT"}}
        </style></head><body>
          <header class="report-head"><div><div class="brand">MANAGEMENT</div><h1>${title}</h1><p class="meta">${subtitle}</p></div><div class="stamp">تاريخ الإصدار: ${today()}</div></header>
          ${content}<footer class="footer"><span>التقرير المالي</span><span></span></footer>
        </body></html>`);
      printWindow.document.close();
      printWindow.focus();
      setTimeout(() => printWindow.print(), 350);
    }

    // تصدير كشف المصروفات الموحد، بجميع الأموال الخارجة خلال الفترة المختارة.
    function exportExpensesPdf() {
      if (tab !== "expenses") return;
      const rows = unifiedOutflows();
      const normal = rows.filter(x => x.source === "expenses").reduce((s, x) => s + n(x.amount), 0);
      const traders = rows.filter(x => x.source === "traderTx").reduce((s, x) => s + n(x.amount), 0);
      const sellers = rows.filter(x => x.source === "withdrawals").reduce((s, x) => s + n(x.amount), 0);
      const content = `
        <div class="summary-grid">
          <div class="metric">إجمالي المصروفات<b>${m(normal + traders + sellers)}</b></div>
          <div class="metric">عدد البنود<b>${rows.length}</b></div>
          <div class="metric">المصروفات الكاش<b>${m(normal)}</b></div>
          <div class="metric">دفعات التجار<b>${m(traders)}</b></div>
          <div class="metric"> مسحوبات البائعين<b>${m(sellers)}</b></div>
        </div>
        <h2>تفاصيل المصروفات </h2>
        <table><thead><tr><th>#</th><th>التاريخ</th><th>البند</th><th>النوع</th><th>القيمة</th><th>المصدر</th></tr></thead><tbody>
          ${rows.map((x, i) => `<tr><td>${i + 1}</td><td>${x.date}</td><td>${x.item}</td><td><span class="tag">${x.type}</span></td><td>${m(x.amount)}</td><td>${x.source === "expenses" ? "مصروفات المحل" : x.source === "traderTx" ? "دفعات التجار" : "مسحوبات البائعين"}</td></tr>`).join("") || `<tr><td colspan="6">لا توجد عمليات خلال الفترة المختارة</td></tr>`}
        </tbody></table>`;
      printPdf(`كشف مصروفات - ${meta()[1]}`, `الفترة: من ${period.from} إلى ${period.to}`, content);
    }

    // تصدير تقرير الأرباح كملف PDF عن طريق نافذة الطباعة في المتصفح.
    function exportProfitPdf() {
      if (tab !== "profits") return;

      const shopName = meta()[1];
      const p = profitCalc();
      const commission = n(sessionStorage["comm" + store]);
      const salaryBase = Math.max(0, p.salesEgp - p.pieces);
      const salariesTotal = salaryBase * commission / 100;
      const fixedSalariesTotal = st().fixedSellers.reduce((sum, x) => sum + n(x.salary), 0);
      const eachSalary = st().sellers.length ? salariesTotal / st().sellers.length : 0;
      const advanceSummary = sellerAdvanceSummary();
      const salariesAfterAdvances = Math.max(0, salariesTotal - advanceSummary.commissionAdvances);
      const fixedSalariesAfterAdvances = Math.max(0, fixedSalariesTotal - advanceSummary.fixedAdvances);
      const netProfit = p.salesEgp - (salariesAfterAdvances + fixedSalariesAfterAdvances + p.expenses);
      const withdrawals = advanceSummary.withdrawals;

const totalExpensesIncludingSalaries = p.expenses + salariesAfterAdvances + fixedSalariesAfterAdvances;

const summaryRows = [
  ["المبيعات قبل خصم الفيزا", m(p.grossSalesEgp)],
  ["خصم الفيزا 3%", m(p.visaDisc)],
  ["المبيعات بعد خصم الفيزا", m(p.salesEgp)],
  ["إجمالي المصروفات", m(totalExpensesIncludingSalaries)],
  ["صافي ربح الشركاء", m(netProfit)]
];

      const sellersRows = st().sellers.map(s => `
        <tr>
          <td>${s.name}</td>
          <td>${m(eachSalary)}</td>
          <td>${m(withdrawals[s.name] || 0)}</td>
          <td>${m(eachSalary - (withdrawals[s.name] || 0))}</td>
        </tr>
      `).join("") || `<tr><td colspan="4">لا يوجد بائعين</td></tr>`;

      const partnersRows = st().partners.map(x => `
        <tr>
          <td>${x.name}</td>
          <td>${m(x.percent)}%</td>
          <td>${m(netProfit * n(x.percent) / 100)}</td>
        </tr>
      `).join("") || `<tr><td colspan="3">لا يوجد شركاء</td></tr>`;

      const printWindow = window.open("", "_blank");

      printWindow.document.write(`
        <!doctype html>
        <html lang="ar" dir="rtl">
        <head>
          <meta charset="utf-8">
          <title>تقرير أرباح ${shopName}</title>
          <style>
            @page{size:A4;margin:14mm 12mm 16mm}
            *{box-sizing:border-box} body{font-family:Tahoma,Arial,sans-serif;margin:0;color:#142033;line-height:1.55;font-size:12px}
            .report-head{border-bottom:3px solid #17808b;padding:0 0 12px;margin-bottom:18px}.brand{font-weight:900;color:#17808b;letter-spacing:.6px}
            h1{margin:2px 0 6px;font-size:24px;color:#0b1220} h2{margin:22px 0 8px;font-size:16px;color:#123b52;border-right:4px solid #22a6b3;padding-right:8px}
            .meta{margin:0 0 18px;color:#52677d}.summary{margin-top:8px}
            table{width:100%;border-collapse:collapse;margin-top:8px;page-break-inside:auto}tr{page-break-inside:avoid}
            th,td{border:1px solid #cddae2;padding:7px 8px;text-align:right}th{background:#123b52;color:#fff;font-size:11px}tbody tr:nth-child(even) td{background:#f5f8fa}
            .summary td:first-child{font-weight:700;background:#f5f9fb}.total td{font-weight:900;background:#dff3f4!important}
          </style>
        </head>
        <body>
          <header class="report-head"><div class="brand">MANAGEMENT</div><h1>تقرير أرباح ${shopName}</h1></header>
          <p class="meta">الفترة: من ${period.from} إلى ${period.to} | تاريخ الإصدار: ${today()}</p>

          <h2>ملخص التقرير</h2>
          <table class="summary">
            ${summaryRows.map(row => `
              <tr class="${row[0] === "صافي ربح الشركاء" ? "total" : ""}">
                <td>${row[0]}</td>
                <td>${row[1]}</td>
              </tr>
            `).join("")}
          </table>

          <h2>مرتبات البائعين</h2>
          <table>
            <tr><th>البائع</th><th>المستحق</th><th>المسحوبات</th><th>الفعلي</th></tr>
            ${sellersRows}
          </table>

          <h2>أرباح الشركاء</h2>
          <table>
            <tr><th>الشريك</th><th>النسبة</th><th>الربح</th></tr>
            ${partnersRows}
          </table>
        </body>
        </html>
      `);

      printWindow.document.close();
      printWindow.focus();
      setTimeout(() => printWindow.print(), 300);
    }

    /* =========================================================
       الحفظ بزر Enter
       ========================================================= */

    // عند الضغط على Enter يتم حفظ الشيت المفتوح حاليًا.
    document.addEventListener("keydown", e => {
      if (e.key !== "Enter" || e.shiftKey || !store) return;
      if (["TEXTAREA", "BUTTON"].includes(e.target.tagName)) return;

      e.preventDefault();

      if (tab === "sales") saveSale();
      else if (tab === "exchange") saveEx();
      else if (tab === "traders") saveTrader();
      else if (tab === "items") saveItem();
      else if (tab === "expenses") {
        const withdrawalFields = ["wdY", "wdM", "wdD", "ws", "wa"];
        if (document.activeElement && withdrawalFields.includes(document.activeElement.id)) saveWithdrawal();
        else saveExpense();
      } else if (tab === "sellers") {
        if (document.activeElement && ["fsn", "fss"].includes(document.activeElement.id)) addFixedSeller();
        else addSeller();
      } else if (tab === "profits") {
        if (q("pn") && pn.value.trim()) addPartner();
        else if (q("cm")) {
          sessionStorage["comm" + store] = cm.value;
          draw();
        }
      }
    });

    // أول تشغيل للبرنامج.
    applyViewMode();
    home();
  </script>
</body>
</html>
