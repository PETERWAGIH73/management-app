<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MANAGEMENT</title>

  <style>
    :root {
      --black: #0b1220; --ink: #e7edf7; --muted: #9caec4;
      --line: #283a52; --panel: #111d2e; --panel-soft: #17263a;
      --orange: #22a6b3; --orange-dark: #17808b;
      --red: #dc5a67; --green: #50d09a; --yellow: #f0b429;
      --dark-bg: #07111f; --shadow: 0 18px 45px rgba(0, 0, 0, .36);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: radial-gradient(circle at top right, #173553 0, var(--dark-bg) 42%, #050b14 100%);
      color: var(--ink); font-size: 15px; line-height: 1.55;
    }
    button, input, select, textarea { font: inherit; }
    button {
      border: 0; border-radius: 10px; padding: 11px 16px;
      background: var(--orange); color: white; font-weight: 800;
      cursor: pointer; box-shadow: 0 8px 18px rgba(249, 115, 22, .18);
      transition: .15s ease;
    }
    button:hover { background: var(--orange-dark); transform: translateY(-1px); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .gray { background: #22334a; box-shadow: 0 8px 18px rgba(0,0,0,.22); }
    .gray:hover { background: #304862; }
    .light { background: #1c3049; color: #dce9f6; border: 1px solid var(--line); box-shadow: none; }
    .light:hover { background: #294564; color: #fff; }
    .danger { background: var(--red); box-shadow: 0 8px 18px rgba(185,28,28,.18); }
    .danger:hover { background: #b93f51; }
    .success { background: #2a8f5f; }
    .success:hover { background: #237a50; }
    .warn { background: #b8860b; }
    .warn:hover { background: #9c7209; }
    input, select, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 10px;
      padding: 11px 12px; background: #0d1828; color: var(--ink); outline: none;
    }
    input[type="checkbox"] { width: auto; accent-color: var(--orange); }
    input:focus, select:focus, textarea:focus {
      border-color: var(--orange); box-shadow: 0 0 0 3px rgba(34,166,179,.20);
    }
    label { display: grid; gap: 7px; font-size: 13px; color: var(--muted); font-weight: 800; }
    textarea { min-height: 46px; resize: vertical; }
    .shop-choice {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 11px; border: 1px solid var(--line);
      border-radius: 9px; background: var(--panel-soft);
      color: var(--ink); cursor: pointer;
    }
    .top {
      position: sticky; top: 0; z-index: 8;
      display: flex; justify-content: space-between; gap: 14px;
      align-items: center; padding: 12px 22px;
      background: rgba(7,17,31,.96); border-bottom: 3px solid var(--orange);
      color: white; box-shadow: 0 8px 28px rgba(0,0,0,.22);
    }
    .top b { font-size: 20px; letter-spacing: .8px; }
    .top-right { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .actions, .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .row button, .grid button { margin-top: 4px; min-width: 120px; }
    .page { width: min(1060px, calc(100% - 34px)); margin: auto; padding: 18px 0 32px; }
    .title {
      text-align: center; font-size: clamp(38px, 6vw, 70px);
      margin: 18px 0 20px; font-weight: 900; color: white; letter-spacing: 1px;
    }
    .stores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .store {
      width: 100%; min-height: 92px;
      background: linear-gradient(145deg, #182a41, #101c2d);
      color: var(--ink); border: 1px solid #2e4967;
      box-shadow: var(--shadow); font-size: clamp(17px, 1.7vw, 23px);
      border-bottom: 5px solid var(--orange);
    }
    .store-tile { position: relative; }
    .delete-store {
      position: absolute; top: 8px; left: 8px; z-index: 1;
      min-width: 0; padding: 4px 7px; border-radius: 7px;
      font-size: 11px; box-shadow: none;
    }
    .store:hover { background: #1c5262; color: white; border-color: #36b7bf; }
    .wide { display: block; width: min(560px,100%); margin: 14px auto 0; min-height: 54px; font-size: 17px; }
    .panel {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; box-shadow: var(--shadow);
      padding: 22px; margin-top: 18px;
    }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 12px; }
    .head h1 { margin: 0; font-size: clamp(28px,4vw,46px); color: white; font-weight: 750; }
    .tabs {
      position: sticky; top: 68px; z-index: 6;
      display: flex; gap: 10px; overflow: auto;
      padding: 12px 10px 14px; border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px; margin-bottom: 18px;
      background: rgba(10,25,43,.96); box-shadow: 0 12px 30px rgba(0,0,0,.22);
      backdrop-filter: blur(8px);
    }
    .tab { white-space: nowrap; background: #14243a; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
    .tab.on { background: var(--orange); color: white; border-color: var(--black); }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 14px; align-items: end; }
    .grid3 { grid-template-columns: repeat(3, minmax(150px, 1fr)); }
    .datebox { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
    .cards { display: grid; grid-template-columns: repeat(4, minmax(155px, 1fr)); gap: 12px; margin-top: 16px; }
    .card { background: var(--panel-soft); border: 1px solid var(--line); border-radius: 12px; padding: 14px; color: var(--muted); }
    .card strong { display: block; font-size: 22px; color: #fff; margin-top: 4px; }
    h2 { font-size: 24px; margin: 2px 0 16px; color: #fff; font-weight: 750; }
    h3 { font-size: 18px; margin: 22px 0 12px; color: #c8d6e6; font-weight: 700; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
    table {
      width: 100%; border-collapse: separate; border-spacing: 0;
      margin-top: 14px; background: #0d1828; border: 1px solid var(--line);
      border-radius: 12px; overflow: hidden;
    }
    th, td { border-bottom: 1px solid var(--line); padding: 11px 10px; text-align: right; vertical-align: top; }
    th { background: var(--black); color: white; font-size: 13px; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #14243a; }
    td button { padding: 8px 11px; border-radius: 8px; margin: 4px; }
    .file { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .ok { color: var(--green); font-weight: 900; }
    .bad { color: var(--red); font-weight: 900; }
    .pending { color: var(--yellow); font-weight: 900; }
    .chart-wrap {
      display: grid; grid-template-columns: minmax(240px, 340px) 1fr;
      gap: 22px; align-items: center; margin-top: 16px;
      padding: 18px; border: 1px solid var(--line); border-radius: 14px;
      background: #0d1828;
    }
    .pie-svg { width: min(320px, 100%); height: auto; display: block; margin: auto; transform: rotate(-90deg); }
    .legend-row {
      display: grid; grid-template-columns: 18px 1fr auto;
      gap: 10px; align-items: center; padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }
    .legend-row:last-child { border-bottom: 0; }
    .legend-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
    .bar-chart { display: grid; gap: 14px; margin-top: 16px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: #0d1828; }
    .bar-row { display: grid; grid-template-columns: minmax(120px,180px) 1fr; gap: 12px; align-items: center; }
    .bar-name { font-weight: 800; color: var(--ink); }
    .bar-track { display: grid; gap: 6px; }
    .bar-line {
      height: 22px; min-width: 2px; border-radius: 8px; color: white;
      display: flex; align-items: center; padding: 0 8px;
      font-size: 12px; font-weight: 800; white-space: nowrap;
    }
    .sync-status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 9px; font-size: 12px;
      font-weight: 800; border: 1px solid var(--line);
      background: #1c3049; color: #dce9f6; cursor: pointer; user-select: none;
    }
    .sync-dot { width: 9px; height: 9px; border-radius: 50%; background: #7a8ca0; flex-shrink: 0; }
    .sync-status.online .sync-dot { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
    .sync-status.offline .sync-dot { background: var(--red); }
    .sync-status.syncing .sync-dot { background: var(--orange); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    .auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .auth-box {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 18px; box-shadow: var(--shadow);
      padding: 32px; width: min(420px, 100%);
    }
    .auth-box h1 { text-align: center; font-size: 32px; margin: 0 0 8px; color: white; letter-spacing: 1px; font-weight: 900; }
    .auth-box .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 24px; }
    .auth-tabs { display: flex; background: #0d1828; border-radius: 10px; padding: 4px; margin-bottom: 20px; gap: 4px; }
    .auth-tab {
      flex: 1; padding: 10px; text-align: center; border-radius: 8px;
      background: transparent; color: var(--muted); border: 0;
      box-shadow: none; font-weight: 800; cursor: pointer; font-size: 13px;
    }
    .auth-tab.on { background: var(--orange); color: white; box-shadow: none; }
    .auth-tab:hover:not(.on) { background: #14243a; color: var(--ink); transform: none; }
    .auth-msg {
      margin-top: 14px; padding: 10px 12px; border-radius: 9px;
      font-size: 13px; font-weight: 700; text-align: center; display: none;
    }
    .auth-msg.error { background: rgba(220,90,103,.15); color: #ff8a96; border: 1px solid rgba(220,90,103,.3); display: block; }
    .auth-msg.success { background: rgba(80,208,154,.15); color: #6ee6b0; border: 1px solid rgba(80,208,154,.3); display: block; }
    .auth-msg.info { background: rgba(34,166,179,.15); color: #5ed4de; border: 1px solid rgba(34,166,179,.3); display: block; }
    .auth-link { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
    .auth-link a { color: var(--orange); cursor: pointer; text-decoration: underline; font-weight: 800; }
    .auth-link a:hover { color: #5ed4de; }
    .waiting-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
    .waiting-box {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 18px; box-shadow: var(--shadow);
      padding: 40px; width: min(500px, 100%);
    }
    .waiting-icon { font-size: 64px; margin-bottom: 16px; display: block; }
    .waiting-box h2 { margin: 0 0 12px; font-size: 22px; }
    .waiting-box p { color: var(--muted); margin: 0 0 20px; line-height: 1.7; }
    .user-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 9px; font-size: 12px;
      font-weight: 800; border: 1px solid var(--line);
      background: #1c3049; color: #dce9f6;
    }
    .user-badge.admin { background: #2a8f5f; color: white; border-color: #2a8f5f; }
    .mode-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px; border-radius: 10px;
      background: #1c3049; color: #dce9f6;
      border: 1px solid var(--line); cursor: pointer;
      font-weight: 800; box-shadow: none; transition: .15s ease;
    }
    body.mode-mobile { font-size: 13px; }
    body.mode-mobile .page { width: calc(100% - 16px); padding: 10px 0 24px; }
    body.mode-mobile .top { padding: 8px 10px; gap: 8px; flex-wrap: wrap; }
    body.mode-mobile .top b { font-size: 16px; }
    body.mode-mobile .top-right { gap: 8px; }
    body.mode-mobile .actions { gap: 6px; }
    body.mode-mobile .actions button, body.mode-mobile .top > .danger { padding: 7px 10px; font-size: 12px; min-width: 0; }
    body.mode-mobile .mode-toggle, body.mode-mobile .user-badge { padding: 6px 8px; font-size: 11px; }
    body.mode-mobile .sync-status { padding: 5px 8px; font-size: 11px; }
    body.mode-mobile .title { font-size: 28px; margin: 10px 0 14px; }
    body.mode-mobile .head h1 { font-size: 22px; }
    body.mode-mobile .panel { padding: 12px; }
    body.mode-mobile h2 { font-size: 18px; }
    body.mode-mobile h3 { font-size: 15px; }
    body.mode-mobile .tabs { padding: 8px; gap: 6px; }
    body.mode-mobile .tab { padding: 7px 10px; font-size: 12px; }
    body.mode-mobile .grid, body.mode-mobile .grid3 { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    body.mode-mobile .cards { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    body.mode-mobile .card { padding: 10px; font-size: 12px; }
    body.mode-mobile .card strong { font-size: 17px; }
    body.mode-mobile .stores { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    body.mode-mobile .store { min-height: 70px; font-size: 15px; }
    body.mode-mobile .row button, body.mode-mobile .grid button { min-width: 0; padding: 8px 10px; font-size: 12px; }
    body.mode-mobile label { font-size: 12px; }
    body.mode-mobile input, body.mode-mobile select, body.mode-mobile textarea { padding: 8px 10px; font-size: 13px; }
    body.mode-mobile .auth-box { padding: 24px; }
    body.mode-mobile .auth-box h1 { font-size: 26px; }
    .table-scroll { width: 100%; max-width: 100%; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; margin-top: 14px; }
    .table-scroll table { margin-top: 0; width: max-content; min-width: 100%; }
    body.mode-mobile .table-scroll table th, body.mode-mobile .table-scroll table td { white-space: nowrap; padding: 6px 8px; font-size: 11px; }
    body.mode-mobile .page, body.mode-mobile .panel { overflow-x: hidden; }
    @media (max-width: 860px) {
      .stores, .grid, .grid3, .cards { grid-template-columns: 1fr; }
      .top { align-items: flex-start; flex-direction: column; }
      .top-right { align-items: flex-start; flex-direction: column; gap: 10px; }
      .tabs { top: 116px; }
      .chart-wrap, .bar-row { grid-template-columns: 1fr; }
      .page { width: min(100% - 22px, 1200px); }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <script>
    /* =========================================================
       Firebase Init
       ========================================================= */
    const firebaseConfig = {
      apiKey: "AIzaSyD8ViNohFXIu6oPU3m5H_lxlcvGERX2tZo",
      authDomain: "management-tp.firebaseapp.com",
      databaseURL: "https://management-tp-default-rtdb.firebaseio.com",
      projectId: "management-tp",
      storageBucket: "management-tp.firebasestorage.app",
      messagingSenderId: "925263845723",
      appId: "1:925263845723:web:482be2e470b9a381bfa27e"
    };

    firebase.initializeApp(firebaseConfig);
    const fbAuth = firebase.auth();
    const fbDB = firebase.database();

    const ADMIN_UID = "lywCmAAMFtMqKsebBb9ouXtwjpH2";
    const FB_PATH = "management/data";
    const USERS_PATH = "management/users";
    const LS_KEY = "managementData";
    const LS_BACKUP_KEY = "managementDataBackup";
    const LS_LAST_SYNC = "managementLastSync";
    const CLIENT_ID_KEY = "managementClientId";

    let currentUser = null;
    let userRole = "guest";
    let isAdmin = false;
    let canView = false;
    let currentUserData = null;

    let data = null;
    let store = "";
    let tab = "sales";
    let edit = null;
    let period = null;
    let isOnline = false;
    let isSyncing = false;
    let clientId = "";
    let authMode = "login";
    let fbDataListener = null;
    let fbConnListener = null;
    let authListenerSet = false;

    /* =========================================================
       الثوابت
       ========================================================= */
    const stores = [
      ["cleopatra", "كليوبترا", 0],
      ["aladdin", "علاء الدين", 0],
      ["lobby", "اللوبي", 1],
      ["bardi", "سيفا البردي", 1],
      ["sindbad", "سيفا السندباد", 1],
      ["portofino", "بورتوفينو", 1]
    ];

    const tabNames = {
      sales: "المبيعات اليومية",
      exchange: "تغيير العملة",
      traders: "التجار",
      sellers: "البائعين",
      expenses: "المصروفات والمسحوبات",
      profits: "توزيع الأرباح",
      items: "الاصناف"
    };

    const blank = () => ({
      sales: [], exchange: [], traderTx: [], sellers: [], fixedSellers: [],
      items: [], expenses: [], withdrawals: [], partners: []
    });

    /* =========================================================
       أدوات
       ========================================================= */
    function getClientId() {
      let id = localStorage[CLIENT_ID_KEY];
      if (!id) {
        id = "client-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        localStorage[CLIENT_ID_KEY] = id;
      }
      return id;
    }

    // ⚠️ دالة مركزية: تتأكد إن كل الحقول موجودة في البيانات
    function ensureAllFields(obj) {
      if (!obj || typeof obj !== "object") obj = {};
      obj.traders ||= [];
      obj.customStores ||= [];
      obj.deletedStoreIds ||= [];
      obj.viewMode ||= "desktop";
      obj.stores ||= {};
      Object.keys(obj.stores).forEach(sid => {
        const s = obj.stores[sid];
        if (!s || typeof s !== "object") obj.stores[sid] = blank();
        else {
          const ss = obj.stores[sid];
          ss.sales ||= [];
          ss.exchange ||= [];
          ss.traderTx ||= [];
          ss.sellers ||= [];
          ss.fixedSellers ||= [];
          ss.items ||= [];
          ss.expenses ||= [];
          ss.withdrawals ||= [];
          ss.partners ||= [];
        }
      });
      return obj;
    }

    function loadLocal() {
      try {
        const saved = JSON.parse(localStorage[LS_KEY] || localStorage["h1group"]);
        if (saved) return ensureAllFields(saved);
      } catch (e) { console.error(e); }
      return ensureAllFields({
        traders: [], customStores: [], deletedStoreIds: [], viewMode: "desktop",
        stores: {}
      });
    }

    function saveLocal() {
      try {
        localStorage[LS_KEY] = JSON.stringify(data);
        localStorage[LS_BACKUP_KEY] = JSON.stringify(data);
      } catch (e) { console.error("Local save failed:", e); }
    }

    function save() {
      saveLocal();
      if (isAdmin) saveRemote();
    }

    function saveRemote() {
      if (!fbDB || !isAdmin) return Promise.resolve();
      isSyncing = true;
      updateSyncUI();
      return fbDB.ref(FB_PATH).set({
        ...data,
        _lastUpdate: { clientId, time: Date.now() }
      }).then(() => {
        localStorage[LS_LAST_SYNC] = Date.now().toString();
      }).catch(e => {
        console.error("Firebase save failed:", e);
      }).finally(() => {
        isSyncing = false;
        updateSyncUI();
      });
    }

    function id() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function n(v) { return Number(v) || 0; }
    function m(v) {
      const r = Math.round(n(v) * 100) / 100;
      return Number.isInteger(r) ? String(r) : r.toFixed(2);
    }
    function q(sid) { return document.getElementById(sid); }
    function st() { return data.stores[store] || blank(); }
    function meta() { return stores.find(s => s[0] === store); }

    function today() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }

    function parts(v) {
      const x = (v || today()).split("-");
      return { y: n(x[0]) || new Date().getFullYear(), m: n(x[1]) || new Date().getMonth()+1, d: n(x[2]) || new Date().getDate() };
    }

    function dateBox(prefix, value) {
      const p = parts(value);
      const cy = new Date().getFullYear();
      let years = "", months = "", days = "";
      for (let y = cy - 6; y <= cy + 2; y++) years += `<option value="${y}" ${p.y===y?"selected":""}>${y}</option>`;
      for (let mo = 1; mo <= 12; mo++) months += `<option value="${mo}" ${p.m===mo?"selected":""}>${mo}</option>`;
      for (let d = 1; d <= 31; d++) days += `<option value="${d}" ${p.d===d?"selected":""}>${d}</option>`;
      return `<div class="datebox"><select id="${prefix}Y">${years}</select><select id="${prefix}M">${months}</select><select id="${prefix}D">${days}</select></div>`;
    }

    function dateValue(prefix) {
      const y = n(q(prefix+"Y").value);
      const mo = n(q(prefix+"M").value);
      let d = n(q(prefix+"D").value);
      const last = new Date(y, mo, 0).getDate();
      if (d > last) d = last;
      const v = `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      if (store) localStorage[`managementDate:${store}:${prefix}`] = v;
      return v;
    }

    function thisMonth() {
      const d = new Date();
      const y = d.getFullYear(), mo = String(d.getMonth()+1).padStart(2,"0");
      const last = new Date(y, d.getMonth()+1, 0).getDate();
      return { from: `${y}-${mo}-01`, to: `${y}-${mo}-${last}` };
    }

    function loadSavedPeriod() {
      try {
        const s = JSON.parse(localStorage.managementPeriod);
        if (s?.from && s?.to) return s;
      } catch (e) {}
      return thisMonth();
    }

    function setPeriod(p) { period = p; localStorage.managementPeriod = JSON.stringify(period); }
    function rememberedDate(prefix) { return localStorage[`managementDate:${store}:${prefix}`] || today(); }
    function inP(d) { return d && (!period.from || d >= period.from) && (!period.to || d <= period.to); }
    function fl(list) { return Array.isArray(list) ? list.filter(x => inP(x.date)) : []; }

    function unifiedOutflows() {
      const shop = st();
      return [
        ...fl(shop.expenses).map(x => ({ ...x, source: "expenses", type: "مصروفات كاش", item: x.item })),
        ...fl(shop.traderTx).filter(x => x.kind === "payment").map(x => ({ ...x, source: "traderTx", type: "دفعة تاجر", item: `دفعة تاجر - ${x.name}` })),
        ...fl(shop.withdrawals).map(x => ({ ...x, source: "withdrawals", type: "مسحوبات", item: `مسحوبات - ${x.seller}` }))
      ].sort((a, b) => String(b.date).localeCompare(String(a.date)));
    }

    function unifiedOutflowTotal() { return unifiedOutflows().reduce((s, x) => s + n(x.amount), 0); }

    function syncCustomStores() {
      data.customStores ||= [];
      data.deletedStoreIds ||= [];
      data.stores ||= {};

      const baseStores = [
        ["cleopatra", "كليوبترا", 0],
        ["aladdin", "علاء الدين", 0],
        ["lobby", "اللوبي", 1],
        ["bardi", "سيفا البردي", 1],
        ["sindbad", "سيفا السندباد", 1],
        ["portofino", "بورتوفينو", 1]
      ];

      stores.length = 0;

      baseStores.forEach(s => {
        if (!data.deletedStoreIds.includes(s[0])) {
          stores.push(s);
          if (!data.stores[s[0]]) data.stores[s[0]] = blank();
          const ss = data.stores[s[0]];
          ss.sales ||= [];
          ss.exchange ||= [];
          ss.traderTx ||= [];
          ss.sellers ||= [];
          ss.fixedSellers ||= [];
          ss.items ||= [];
          ss.expenses ||= [];
          ss.withdrawals ||= [];
          ss.partners ||= [];
        }
      });

      data.customStores.forEach(s => {
        if (!Array.isArray(s) || !s[0] || !s[1]) return;
        if (data.deletedStoreIds.includes(s[0])) return;
        if (stores.some(x => x[0] === s[0])) return;
        stores.push([s[0], s[1], s[2] ? 1 : 0]);
        if (!data.stores[s[0]]) data.stores[s[0]] = blank();
        const ss = data.stores[s[0]];
        ss.sales ||= [];
        ss.exchange ||= [];
        ss.traderTx ||= [];
        ss.sellers ||= [];
        ss.fixedSellers ||= [];
        ss.items ||= [];
        ss.expenses ||= [];
        ss.withdrawals ||= [];
        ss.partners ||= [];
      });
    }

    function applyViewMode() {
      const mode = data.viewMode === "mobile" ? "mobile" : "desktop";
      document.body.classList.remove("mode-mobile", "mode-desktop");
      document.body.classList.add(mode === "mobile" ? "mode-mobile" : "mode-desktop");
      const btn = document.getElementById("modeToggleBtn");
      if (btn) btn.textContent = mode === "mobile" ? " فون" : " كمبيوتر";
    }

    function toggleViewMode() {
      data.viewMode = data.viewMode === "mobile" ? "desktop" : "mobile";
      save();
      applyViewMode();
    }

    function updateSyncUI() {
      const el = document.getElementById("syncStatus");
      const txt = document.getElementById("syncText");
      if (!el || !txt) return;
      el.classList.remove("online", "offline", "syncing");
      if (isSyncing) { el.classList.add("syncing"); txt.textContent = "جاري المزامنة..."; }
      else if (isOnline) { el.classList.add("online"); txt.textContent = "متصل"; }
      else { el.classList.add("offline"); txt.textContent = "غير متصل"; }
    }
  </script>

  <script>
    /* =========================================================
       شاشة تسجيل الدخول
       ========================================================= */
    function renderAuthScreen() {
      document.getElementById("root").innerHTML = `
        <div class="auth-screen">
          <div class="auth-box">
            <h1>MANAGEMENT</h1>
            <p class="subtitle">سجل دخولك للمتابعة</p>
            <div class="auth-tabs">
              <button class="auth-tab on" id="tabLogin" onclick="switchAuthTab('login')">تسجيل دخول</button>
              <button class="auth-tab" id="tabSignup" onclick="switchAuthTab('signup')">إنشاء حساب</button>
            </div>
            <div id="authForm">
              <label>الإيميل
                <input type="email" id="authEmail" placeholder="example@email.com" autocomplete="email">
              </label>
              <br>
              <label>الباسورد
                <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password">
              </label>
              <br>
              <label id="authNameWrap" style="display:none">الاسم
                <input type="text" id="authName" placeholder="اسمك">
              </label>
              <br id="authNameBr" style="display:none">
              <button id="authSubmit" onclick="submitAuth()" style="width:100%;min-height:46px">تسجيل الدخول</button>
            </div>
            <div class="auth-msg" id="authMsg"></div>
            <div class="auth-link"><a onclick="resetPassword()">نسيت كلمة السر؟</a></div>
          </div>
        </div>
      `;
      setTimeout(() => document.getElementById("authEmail")?.focus(), 100);
      ["authEmail", "authPassword"].forEach(id => {
        document.getElementById(id)?.addEventListener("keypress", e => {
          if (e.key === "Enter") submitAuth();
        });
      });
    }

    function switchAuthTab(mode) {
      authMode = mode;
      document.getElementById("tabLogin").classList.toggle("on", mode === "login");
      document.getElementById("tabSignup").classList.toggle("on", mode === "signup");
      document.getElementById("authNameWrap").style.display = mode === "signup" ? "" : "none";
      document.getElementById("authNameBr").style.display = mode === "signup" ? "" : "none";
      document.getElementById("authSubmit").textContent = mode === "login" ? "تسجيل الدخول" : "إنشاء حساب";
      document.getElementById("authPassword").autocomplete = mode === "login" ? "current-password" : "new-password";
      hideAuthMsg();
    }

    function showAuthMsg(text, type = "error") {
      const el = document.getElementById("authMsg");
      if (!el) return;
      el.textContent = text;
      el.className = "auth-msg " + type;
    }

    function hideAuthMsg() {
      const el = document.getElementById("authMsg");
      if (el) { el.className = "auth-msg"; el.textContent = ""; }
    }

    async function submitAuth() {
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;
      const name = document.getElementById("authName")?.value.trim() || "";

      if (!email || !password) { showAuthMsg("اكتب الإيميل والباسورد"); return; }
      if (password.length < 6) { showAuthMsg("الباسورد لازم يكون 6 حروف على الأقل"); return; }

      const btn = document.getElementById("authSubmit");
      btn.disabled = true;
      btn.textContent = "...";

      try {
        if (authMode === "login") {
          await fbAuth.signInWithEmailAndPassword(email, password);
        } else {
          const cred = await fbAuth.createUserWithEmailAndPassword(email, password);
          await fbDB.ref(`${USERS_PATH}/${cred.user.uid}`).set({
            email: email,
            name: name || email.split("@")[0],
            status: "pending",
            role: "viewer",
            blocked: false,
            createdAt: Date.now()
          });
          if (name) {
            try { await cred.user.updateProfile({ displayName: name }); } catch (e) {}
          }
        }
      } catch (e) {
        console.error(e);
        let msg = "حدث خطأ";
        const code = e.code || "";
        if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") {
          msg = "الإيميل أو الباسورد غلط";
        } else if (code === "auth/invalid-email") msg = "الإيميل غير صالح";
        else if (code === "auth/email-already-in-use") msg = "الإيميل ده مستخدم بالفعل. جرب تسجيل الدخول";
        else if (code === "auth/weak-password") msg = "الباسورد ضعيف، استخدم 6 حروف على الأقل";
        else if (code === "auth/too-many-requests") msg = "محاولات كثيرة، جرب بعد شوية";
        else if (code === "auth/network-request-failed") msg = "تحقق من اتصالك بالإنترنت";
        else msg = e.message || "حدث خطأ غير متوقع";
        showAuthMsg(msg);
      } finally {
        btn.disabled = false;
        btn.textContent = authMode === "login" ? "تسجيل الدخول" : "إنشاء حساب";
      }
    }

    async function resetPassword() {
      const email = document.getElementById("authEmail").value.trim();
      if (!email) { showAuthMsg("اكتب الإيميل الأول"); return; }
      try {
        await fbAuth.sendPasswordResetEmail(email);
        showAuthMsg("تم إرسال رابط إعادة التعيين على إيميلك", "success");
      } catch (e) {
        showAuthMsg("فشل الإرسال. تأكد من الإيميل");
      }
    }

    function logout() {
      if (!confirm("تسجيل الخروج؟")) return;
      fbAuth.signOut().catch(e => console.error(e));
    }

    function renderWaitingScreen(status) {
      const isBlocked = status === "blocked";
      document.getElementById("root").innerHTML = `
        <div class="waiting-screen">
          <div class="waiting-box">
            <span class="waiting-icon">${isBlocked ? "⛔" : "⏳"}</span>
            <h2>${isBlocked ? "تم حظر حسابك" : "حسابك في انتظار الموافقة"}</h2>
            <p>${isBlocked
              ? "تم حظر حسابك. ."
              : "تم إنشاء حساب بنجاح ✅<br>انت في انتظار الموافقة من النظام."
            }</p>
            <button class="light" onclick="logout()" style="width:100%;min-height:46px">  خروج</button>
          </div>
        </div>
      `;
    }

    function renderDashboard() {
      const userName = currentUserData?.name || currentUser?.email?.split("@")[0] || "مستخدم";
      const roleLabel = isAdmin ? " admin" : " visitor";

      document.getElementById("root").innerHTML = `
        <header class="top">
          <div class="top-right">
            <b>T.p</b>
            <div class="actions">
              <button class="light" onclick="home()">الرئيسية</button>
              ${isAdmin ? `
                <button class="gray" onclick="backup()">نسخ احتياطي</button>
                <button onclick="document.getElementById('restoreFile').click()">استرجاع</button>
                <input class="file" id="restoreFile" type="file" accept="application/json" onchange="restore(event)">
                <button class="warn" onclick="renderUsersPage()"> الأعضاء</button>
              ` : ""}
              <button class="mode-toggle" id="modeToggleBtn" onclick="toggleViewMode()"> فون</button>
              <span class="sync-status" id="syncStatus" onclick="manualSync()" title="اضغط للمزامنة اليدوية">
                <span class="sync-dot"></span>
                <span id="syncText">جاري الاتصال...</span>
              </span>
              <span class="user-badge ${isAdmin ? 'admin' : ''}">${roleLabel} - ${userName}</span>
              <button class="light" onclick="logout()"> خروج</button>
            </div>
          </div>
          ${isAdmin ? `<button class="danger" onclick="clearAllData()">حذف كل البيانات</button>` : ""}
        </header>
        <main class="page" id="app"></main>
      `;
      applyViewMode();
      home();
    }

    function startDataSync() {
      if (!fbDB) return;

      if (!fbConnListener) {
        fbConnListener = fbDB.ref(".info/connected");
        fbConnListener.on("value", snap => {
          isOnline = snap.val() === true;
          updateSyncUI();
        });
      }

      const dataRef = fbDB.ref(FB_PATH);

      if (isAdmin) {
        if (fbDataListener) dataRef.off("value", fbDataListener);
        fbDataListener = dataRef.on("value", snap => {
          const remote = snap.val();
          if (!remote) { saveRemote(); return; }
          if (remote._lastUpdate?.clientId === clientId) return;
          delete remote._lastUpdate;
          data = ensureAllFields(remote);
          syncCustomStores();
          saveLocal();
          if (document.getElementById("app")) {
            if (store) draw();
            else home();
          }
        }, err => console.error("Read error:", err));
      } else if (canView) {
        fbDB.ref(FB_PATH).once("value").then(snap => {
          const remote = snap.val();
          if (remote) {
            delete remote._lastUpdate;
            data = ensureAllFields(remote);
            syncCustomStores();
            saveLocal();
            if (store) draw();
            else home();
          }
        }).catch(err => console.error("Viewer read error:", err));

        if (fbDataListener) dataRef.off("value", fbDataListener);
        fbDataListener = dataRef.on("value", snap => {
          const remote = snap.val();
          if (!remote) return;
          delete remote._lastUpdate;
          data = ensureAllFields(remote);
          syncCustomStores();
          saveLocal();
          if (document.getElementById("app")) {
            if (store) draw();
            else home();
          }
        }, err => console.error("Viewer read error:", err));
      }
    }

    function stopDataSync() {
      if (fbDataListener) {
        fbDB.ref(FB_PATH).off("value", fbDataListener);
        fbDataListener = null;
      }
    }

    function setupAuthListener() {
      if (authListenerSet) return;
      authListenerSet = true;

      fbAuth.onAuthStateChanged(async user => {
        stopDataSync();

        if (!user) {
          currentUser = null;
          currentUserData = null;
          isAdmin = false;
          canView = false;
          userRole = "guest";
          data = loadLocal();
          syncCustomStores();
          renderAuthScreen();
          return;
        }

        currentUser = user;

        try {
          const snap = await fbDB.ref(`${USERS_PATH}/${user.uid}`).once("value");
          let userData = snap.val();

          if (!userData) {
            if (user.uid === ADMIN_UID) {
              userData = {
                email: user.email, name: user.displayName || user.email.split("@")[0],
                status: "approved", role: "admin", blocked: false, createdAt: Date.now()
              };
              await fbDB.ref(`${USERS_PATH}/${user.uid}`).set(userData);
            } else {
              userData = {
                email: user.email, name: user.displayName || user.email.split("@")[0],
                status: "pending", role: "viewer", blocked: false, createdAt: Date.now()
              };
              await fbDB.ref(`${USERS_PATH}/${user.uid}`).set(userData);
            }
          }

          currentUserData = userData;

          if (user.uid === ADMIN_UID) {
            isAdmin = true;
            canView = true;
            userRole = "admin";
            if (userData.status !== "approved" || userData.role !== "admin") {
              await fbDB.ref(`${USERS_PATH}/${user.uid}`).update({
                status: "approved", role: "admin", blocked: false
              });
            }
            data = loadLocal();
            syncCustomStores();
            period = loadSavedPeriod();
            renderDashboard();
            startDataSync();
            return;
          }

          if (userData.blocked === true) {
            userRole = "blocked"; isAdmin = false; canView = false;
            renderWaitingScreen("blocked");
            return;
          }

          if (userData.status !== "approved") {
            userRole = "pending"; isAdmin = false; canView = false;
            renderWaitingScreen("pending");
            return;
          }

          userRole = "viewer"; isAdmin = false; canView = true;
          data = loadLocal();
          syncCustomStores();
          period = loadSavedPeriod();
          renderDashboard();
          startDataSync();
        } catch (e) {
          console.error("Auth state error:", e);
          renderAuthScreen();
        }
      });
    }
  </script>

  <script>
    /* =========================================================
       التنقل والصفحات
       ========================================================= */
    function home() {
      store = "";
      edit = null;
      history.replaceState(null, "", "#MANAGEMENT");

      document.getElementById("app").innerHTML = `
        <h1 class="title">MANAGEMENT</h1>
        <section class="stores">
          ${stores.map(s => `
            <div class="store-tile">
              <button class="store" onclick="openStore('${s[0]}')">${s[1]}</button>
              ${isAdmin ? `<button class="danger delete-store" onclick="deleteStore('${s[0]}')">حذف</button>` : ""}
            </div>
          `).join("")}
        </section>
        ${isAdmin ? `
          <section class="panel">
            <h2>إضافة محل</h2>
            <div class="grid grid3">
              <label>اسم المحل <input id="newStoreName" placeholder="اكتب اسم المحل"></label>
              <button onclick="addStore()">إضافة محل جديد</button>
            </div>
          </section>
        ` : ""}
        <button class="wide" onclick="collections()">تحصيل المحلات</button>
        <button class="wide" onclick="traderTotals()">إجمالي الأرصدة للتجار</button>
      `;
    }

    function addStore() {
      const name = q("newStoreName").value.trim();
      if (!name) return alert("اكتب اسم المحل");
      if (stores.some(s => s[1] === name)) return alert("هذا المحل موجود بالفعل");
      const newStore = [`store-${id()}`, name, 1];
      stores.push(newStore);
      data.customStores ||= [];
      data.customStores.push(newStore);
      data.stores[newStore[0]] = blank();
      save();
      home();
    }

    function deleteStore(storeId) {
      if (!isAdmin) return;
      const index = stores.findIndex(s => s[0] === storeId);
      if (index < 0) return;
      const name = stores[index][1];
      if (!confirm(`حذف محل ${name} وكل بياناته؟`)) return;
      stores.splice(index, 1);
      delete data.stores[storeId];
      data.customStores = (data.customStores || []).filter(s => s[0] !== storeId);
      if (!storeId.startsWith("store-") && !(data.deletedStoreIds || []).includes(storeId)) {
        data.deletedStoreIds ||= [];
        data.deletedStoreIds.push(storeId);
      }
      save();
      home();
    }

    function storeCollectionTotals(storeId) {
      const shop = ensureAllFields({ stores: { [storeId]: data.stores[storeId] } }).stores[storeId];
      const sales = shop.sales.filter(x => inP(x.date));
      const exchanged = shop.exchange.filter(x => inP(x.date));
      const sum = (list, field) => list.reduce((total, item) => total + n(item[field]), 0);
      const euroSales = sum(sales, "euro");
      const dollarSales = sum(sales, "dollar");
      const gbpSales = sum(sales, "gbp");
      const euroChanged = sum(exchanged, "ea");
      const dollarChanged = sum(exchanged, "da");
      const gbpChanged = sum(exchanged, "ba");
      return {
        euroSales, dollarSales, gbpSales, euroChanged, dollarChanged, gbpChanged,
        euro: euroSales - euroChanged, dollar: dollarSales - dollarChanged, gbp: gbpSales - gbpChanged,
        egp: sum(sales, "egp"), visa: sum(sales, "visa")
      };
    }

    function selectedCollectionStoreIds() {
      const availableIds = stores.map(s => s[0]);
      try {
        const saved = JSON.parse(localStorage.managementCollectionStores);
        if (Array.isArray(saved)) return new Set(saved.filter(id => availableIds.includes(id)));
      } catch (e) {}
      return new Set(availableIds);
    }

    function toggleCollectionStore(storeId, checked) {
      const selected = selectedCollectionStoreIds();
      if (checked) selected.add(storeId); else selected.delete(storeId);
      localStorage.managementCollectionStores = JSON.stringify([...selected]);
      collections();
    }

    function selectAllCollectionStores() {
      localStorage.managementCollectionStores = JSON.stringify(stores.map(s => s[0]));
      collections();
    }

    function collections() {
      store = "";
      edit = null;
      history.replaceState(null, "", "#MANAGEMENT-COLLECTIONS");
      const selectedIds = selectedCollectionStoreIds();
      const rows = stores.filter(s => selectedIds.has(s[0])).map(s => ({ id: s[0], name: s[1], totals: storeCollectionTotals(s[0]) }));
      const total = rows.reduce((all, row) => {
        Object.keys(all).forEach(key => all[key] += row.totals[key]);
        return all;
      }, { euroSales: 0, dollarSales: 0, gbpSales: 0, euroChanged: 0, dollarChanged: 0, gbpChanged: 0, euro: 0, dollar: 0, gbp: 0, egp: 0, visa: 0 });

      document.getElementById("app").innerHTML = `
        <div class="head"><h1>تحصيل المحلات</h1><button class="light" onclick="home()">رجوع</button></div>
        <section class="panel">
          <div class="grid">
            <label>من تاريخ ${dateBox("from", period.from)}</label>
            <label>إلى تاريخ ${dateBox("to", period.to)}</label>
            <button onclick="setPeriod({from:dateValue('from'),to:dateValue('to')}); collections()">الفترة المحددة</button>
            <button class="light" onclick="setPeriod(thisMonth()); collections()">الشهر الحالي</button>
          </div>
          <div class="row">
            <button class="gray" onclick="selectAllCollectionStores()">اختيار كل المحلات</button>
            ${stores.map(s => `<label class="shop-choice"><input type="checkbox" ${selectedIds.has(s[0]) ? "checked" : ""} onchange="toggleCollectionStore('${s[0]}', this.checked)">${s[1]}</label>`).join("")}
          </div>
          <div class="row"><button onclick="exportCollectionsPdf()">تصدير تحصيل المحلات PDF</button></div>
          <div class="cards">
            <div class="card">صافي اليورو <strong>${m(total.euro)}</strong></div>
            <div class="card">صافي الدولار <strong>${m(total.dollar)}</strong></div>
            <div class="card">صافي الجنيه الإنجليزي <strong>${m(total.gbp)}</strong></div>
            <div class="card">إجمالي الجنيه <strong>${m(total.egp)}</strong></div>
            <div class="card">إجمالي الفيزا <strong>${m(total.visa)}</strong></div>
          </div>
          <h2>تفاصيل تحصيل المحلات</h2>
          <div class="table-scroll">
            <table>
              <tr><th>المحل</th><th> € </th><th> EX </th><th> R </th><th> $ </th><th> EX </th><th> R </th><th> £ </th><th> EX </th><th> R </th><th>L.E</th><th>VISA</th></tr>
              ${rows.map(row => `<tr><td>${row.name}</td><td>${m(row.totals.euroSales)}</td><td>${m(row.totals.euroChanged)}</td><td>${m(row.totals.euro)}</td><td>${m(row.totals.dollarSales)}</td><td>${m(row.totals.dollarChanged)}</td><td>${m(row.totals.dollar)}</td><td>${m(row.totals.gbpSales)}</td><td>${m(row.totals.gbpChanged)}</td><td>${m(row.totals.gbp)}</td><td>${m(row.totals.egp)}</td><td>${m(row.totals.visa)}</td></tr>`).join("") || `<tr><td colspan="12">اختر محلًا واحدًا على الأقل لعرض التحصيل</td></tr>`}
              <tr class="total"><td>الإجمالي</td><td>${m(total.euroSales)}</td><td>${m(total.euroChanged)}</td><td>${m(total.euro)}</td><td>${m(total.dollarSales)}</td><td>${m(total.dollarChanged)}</td><td>${m(total.dollar)}</td><td>${m(total.gbpSales)}</td><td>${m(total.gbpChanged)}</td><td>${m(total.gbp)}</td><td>${m(total.egp)}</td><td>${m(total.visa)}</td></tr>
            </table>
          </div>
        </section>
      `;
    }

    function render() {
      const s = meta();
      if (!s) { home(); return; }
      history.replaceState(null, "", `#MANAGEMENT-${encodeURIComponent(s[1])}`);
      document.getElementById("app").innerHTML = `
        <div class="head">
          <h1>${s[1]}</h1>
          <button class="light" onclick="home()">رجوع</button>
        </div>
        <div class="tabs">
          ${Object.entries(tabNames).map(([key, value]) => `
            <button class="tab ${tab === key ? "on" : ""}" onclick="switchTab('${key}')">${value}</button>
          `).join("")}
        </div>
        <section class="panel">
          ${dates()}
          <div id="body"></div>
        </section>
      `;
      draw();
    }

    function switchTab(key) { tab = key; edit = null; render(); }

    function dates() {
      return `
        <div class="grid">
          <label>من تاريخ ${dateBox("from", period.from)}</label>
          <label>إلى تاريخ ${dateBox("to", period.to)}</label>
          <button onclick="setPeriod({from:dateValue('from'),to:dateValue('to')}); render()">الفترة المحددة</button>
          <button class="light" onclick="setPeriod(thisMonth()); render()">الشهر الحالي</button>
        </div>
      `;
    }

    function openStore(storeId) {
      store = storeId;
      tab = "sales";
      edit = null;
      // تأكد إن المحل عنده كل الحقول
      if (!data.stores[storeId]) data.stores[storeId] = blank();
      const ss = data.stores[storeId];
      ss.sales ||= [];
      ss.exchange ||= [];
      ss.traderTx ||= [];
      ss.sellers ||= [];
      ss.fixedSellers ||= [];
      ss.items ||= [];
      ss.expenses ||= [];
      ss.withdrawals ||= [];
      ss.partners ||= [];
      render();
    }

    function draw() {
      const pages = { sales, exchange, traders, sellers, items, expenses, profits };
      const bodyEl = document.getElementById("body");
      if (!bodyEl) return;
      try {
        bodyEl.innerHTML = pages[tab]();
      } catch (err) {
        console.error("Draw error in tab " + tab + ":", err);
        bodyEl.innerHTML = `<div class="card bad">حدث خطأ في تحميل الصفحة: ${err.message}</div>`;
      }
    }

    function up(list, item) {
      if (!isAdmin) return alert("ليس لديك صلاحية للتعديل");
      const index = list.findIndex(x => x.id === item.id);
      if (index > -1) list[index] = item; else list.push(item);
      save(); edit = null; draw();
    }

    function del(type, itemId) {
      if (!isAdmin) return alert("ليس لديك صلاحية للحذف");
      if (!confirm("حذف ؟")) return;
      st()[type] = st()[type].filter(x => x.id !== itemId);
      save(); draw();
    }

    function edt(type, itemId) {
      if (!isAdmin) return;
      edit = { type, id: itemId };
      draw();
    }

    function box(id) {
      const element = q(id);
      if (element) element.style.display = element.style.display === "none" ? "" : "none";
    }

    /* =========================================================
       شيت المبيعات
       ========================================================= */
    function totals() {
      return fl(st().sales).reduce((a, x) => {
        a.euro += n(x.euro); a.dollar += n(x.dollar); a.gbp += n(x.gbp);
        a.egp += n(x.egp); a.visa += n(x.visa); a.pieces += n(x.pieces);
        return a;
      }, { euro: 0, dollar: 0, gbp: 0, egp: 0, visa: 0, pieces: 0 });
    }

    function sales() {
      const r = edit?.type === "sales" ? st().sales.find(x => x.id === edit.id) : {};
      const hasPieces = meta()[2];
      const t = totals();
      const list = fl(st().sales);

      return `
        <h2>المبيعات اليومية</h2>
        ${isAdmin ? `
          <div class="grid">
            <label>التاريخ ${dateBox("sd", r.date || rememberedDate("sd"))}</label>
            <label>اليورو <input id="se" type="number" step="0.01" value="${r.euro || ""}"></label>
            <label>الدولار <input id="su" type="number" step="0.01" value="${r.dollar || ""}"></label>
            <label>الجنيه الإنجليزي <input id="sb" type="number" step="0.01" value="${r.gbp || ""}"></label>
            <label>الجنيه <input id="sg" type="number" step="0.01" value="${r.egp || ""}"></label>
            <label>الفيزا <input id="sv" type="number" step="0.01" value="${r.visa || ""}"></label>
            ${hasPieces ? `<label>إجمالي سعر القطع المباعة <input id="sp" type="number" step="0.01" value="${r.pieces || ""}"></label>` : ""}
          </div>
          <div class="row">
            <button onclick="saveSale()">${r.id ? "تعديل" : "حفظ"}</button>
            <button class="gray" onclick="box('sum')">إجمالي الشهر</button>
            <button class="gray" onclick="box('list')">عرض كل الأيام</button>
            <button onclick="exportSalesPdf()">PDF</button>
          </div>
        ` : `
          <div class="row">
            <button class="gray" onclick="box('sum')">إجمالي الشهر</button>
            <button class="gray" onclick="box('list')">عرض كل الأيام</button>
            <button onclick="exportSalesPdf()">PDF</button>
          </div>
        `}

        <div id="sum" class="cards" style="display:none">
          <div class="card">اليورو <strong>${m(t.euro)}</strong></div>
          <div class="card">الدولار <strong>${m(t.dollar)}</strong></div>
          <div class="card">الجنيه الإنجليزي <strong>${m(t.gbp)}</strong></div>
          <div class="card">الجنيه <strong>${m(t.egp)}</strong></div>
          <div class="card">الفيزا <strong>${m(t.visa)}</strong></div>
          ${hasPieces ? `<div class="card">سعر القطع <strong>${m(t.pieces)}</strong></div>` : ""}
        </div>

        <div id="list" style="display:none">
          <div class="table-scroll">
            ${table(list, "sales",
              ["التاريخ", "يورو", "دولار", "جنيه إنجليزي", "جنيه مصري", "فيزا"].concat(hasPieces ? ["قطع"] : []),
              x => [x.date, m(x.euro), m(x.dollar), m(x.gbp), m(x.egp), m(x.visa)].concat(hasPieces ? [m(x.pieces)] : [])
            )}
          </div>
        </div>
      `;
    }

    function saveSale() {
      if (!isAdmin) return;
      up(st().sales, {
        id: edit?.type === "sales" ? edit.id : id(),
        date: dateValue("sd"),
        euro: n(se.value), dollar: n(su.value), gbp: n(sb.value),
        egp: n(sg.value), visa: n(sv.value),
        pieces: meta()[2] ? n(sp.value) : 0
      });
    }

    function exportSalesPdf() {
      if (tab !== "sales") return;
      const hasPieces = meta()[2];
      const t = totals();
      const rows = fl(st().sales).sort((a, b) => String(a.date).localeCompare(String(b.date)));
      const headers = ["#", "التاريخ", "يورو", "دولار", "جنيه إنجليزي", "جنيه مصري", "فيزا"].concat(hasPieces ? ["قطع"] : []);
      const bodyRows = rows.map((x, i) => [i + 1, x.date, m(x.euro), m(x.dollar), m(x.gbp), m(x.egp), m(x.visa)].concat(hasPieces ? [m(x.pieces)] : []));
      const summary = [
        ["عدد الأيام", rows.length], ["إجمالي اليورو", m(t.euro)], ["إجمالي الدولار", m(t.dollar)],
        ["إجمالي الجنيه الإنجليزي", m(t.gbp)], ["إجمالي الجنيه المصري", m(t.egp)], ["إجمالي الفيزا", m(t.visa)]
      ].concat(hasPieces ? [["إجمالي سعر القطع", m(t.pieces)]] : []);
      const content = `
        <div class="summary-grid">${summary.map(x => `<div class="metric">${x[0]}<b>${x[1]}</b></div>`).join("")}</div>
        <h2>تفاصيل المبيعات اليومية</h2>
        <table><thead><tr>${headers.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>
          ${bodyRows.map(row => `<tr>${row.map(x => `<td>${x}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${headers.length}">لا توجد مبيعات خلال الفترة المختارة</td></tr>`}
        </tbody></table>`;
      printPdf(`تقرير اليوميات - ${meta()[1]}`, `الفترة: من ${period.from} إلى ${period.to}`, content);
    }

    /* =========================================================
       شيت تغيير العملة
       ========================================================= */
    function exStats() {
      const list = fl(st().exchange);
      let euroAmount = 0, euroTotal = 0, dollarAmount = 0, dollarTotal = 0, gbpAmount = 0, gbpTotal = 0;
      list.forEach(x => {
        euroAmount += n(x.ea); euroTotal += n(x.ea) * n(x.er);
        dollarAmount += n(x.da); dollarTotal += n(x.da) * n(x.dr);
        gbpAmount += n(x.ba); gbpTotal += n(x.ba) * n(x.br);
      });
      return {
        eavg: euroAmount ? euroTotal / euroAmount : 0,
        davg: dollarAmount ? dollarTotal / dollarAmount : 0,
        bavg: gbpAmount ? gbpTotal / gbpAmount : 0,
        et: euroTotal, dt: dollarTotal, bt: gbpTotal
      };
    }

    function exchange() {
      const r = edit?.type === "exchange" ? st().exchange.find(x => x.id === edit.id) : {};
      const x = exStats();
      const list = fl(st().exchange);

      return `
        <h2>تغيير العملة</h2>
        ${isAdmin ? `
          <div class="grid">
            <label>التاريخ ${dateBox("ed", r.date || rememberedDate("ed"))}</label>
            <label>عدد اليورو <input id="ea" type="number" step="0.01" value="${r.ea || ""}"></label>
            <label>سعر اليورو <input id="er" type="number" step="0.01" value="${r.er || ""}"></label>
            <label>عدد الدولار <input id="da" type="number" step="0.01" value="${r.da || ""}"></label>
            <label>سعر الدولار <input id="dr" type="number" step="0.01" value="${r.dr || ""}"></label>
            <label>عدد الجنيه الإنجليزي <input id="ba" type="number" step="0.01" value="${r.ba || ""}"></label>
            <label>سعر الجنيه الإنجليزي <input id="br" type="number" step="0.01" value="${r.br || ""}"></label>
          </div>
          <div class="row">
            <button onclick="saveEx()">${r.id ? "تعديل" : "حفظ"}</button>
            <button class="gray" onclick="box('exsum')">متوسط الشهر</button>
            <button class="gray" onclick="box('exlist')">أيام التغيير</button>
          </div>
        ` : `
          <div class="row">
            <button class="gray" onclick="box('exsum')">متوسط الشهر</button>
            <button class="gray" onclick="box('exlist')">أيام التغيير</button>
          </div>
        `}

        <div id="exsum" class="cards" style="display:none">
          <div class="card">متوسط اليورو <strong>${m(x.eavg)}</strong></div>
          <div class="card">متوسط الدولار <strong>${m(x.davg)}</strong></div>
          <div class="card">متوسط الجنيه الإنجليزي <strong>${m(x.bavg)}</strong></div>
        </div>

        <div id="exlist" style="display:none">
          <div class="table-scroll">
            ${table(list, "exchange",
              ["التاريخ", "يورو", "سعر التغيير", "الأجمالي", "دولار", "سعر التغيير", "الأجمالي", "جنيه إنجليزي", "سعر التغيير", "الأجمالي"],
              rr => [rr.date, m(rr.ea), m(rr.er), m(n(rr.ea) * n(rr.er)), m(rr.da), m(rr.dr), m(n(rr.da) * n(rr.dr)), m(rr.ba), m(rr.br), m(n(rr.ba) * n(rr.br))]
            )}
          </div>
        </div>
      `;
    }

    function saveEx() {
      if (!isAdmin) return;
      up(st().exchange, {
        id: edit?.type === "exchange" ? edit.id : id(),
        date: dateValue("ed"),
        ea: n(ea.value), er: n(er.value),
        da: n(da.value), dr: n(dr.value),
        ba: n(ba.value), br: n(br.value)
      });
    }

    /* =========================================================
       شيت التجار
       ========================================================= */
    function traderKindLabel(kind) {
      if (kind === "invoice") return "فاتورة";
      if (kind === "return") return "مرتجع";
      return "دفعة";
    }

    function traderBalance(name) {
      const tx = (st().traderTx || []).filter(x => x.name === name);
      const signed = x => x.kind === "invoice" ? n(x.amount) : -n(x.amount);
      const opening = tx.filter(x => period.from && x.date < period.from).reduce((sum, x) => sum + signed(x), 0);
      const movement = tx.filter(x => inP(x.date)).reduce((sum, x) => sum + signed(x), 0);
      const closing = tx.filter(x => !period.to || x.date <= period.to).reduce((sum, x) => sum + signed(x), 0);
      return { opening, movement, closing };
    }

    function storeTraderBalance() {
      return (st().traderTx || []).filter(x => !period.to || x.date <= period.to).reduce((sum, x) => sum + (x.kind === "invoice" ? n(x.amount) : -n(x.amount)), 0);
    }

    function showTraderLiveBalance(name) {
      sessionStorage.traderSearch = name;
      const target = q("liveTraderBalance");
      if (!target) return;
      if (!name) { target.innerHTML = "اكتب اسم التاجر لعرض الرصيد"; return; }
      const b = traderBalance(name);
      target.innerHTML = `الرصيد المرحل: ${m(b.opening)}<br>حركة الفترة: ${m(b.movement)}<br>الرصيد الحالي: ${m(b.closing)}`;
    }

    function filterTraderTransactions(name) {
      sessionStorage.traderSearch = name;
      const target = q("traderTransactionRows");
      if (!target) return;
      const search = name.trim().toLowerCase();
      const list = fl(st().traderTx || []).filter(x => !search || String(x.name).toLowerCase().includes(search));
      target.innerHTML = list.map(x => `
        <tr>
          <td>${x.date}</td><td>${x.name}</td><td>${traderKindLabel(x.kind)}</td><td>${m(x.amount)}</td>
          <td>${isAdmin ? `<button class="light" onclick="edt('traderTx','${x.id}')">تعديل</button><button class="danger" onclick="del('traderTx','${x.id}')">حذف</button>` : "-"}</td>
        </tr>
      `).join("") || `<tr><td colspan="5">${search ? "لا توجد معاملات لهذا التاجر خلال الفترة" : "لا توجد معاملات خلال الفترة"}</td></tr>`;
    }

    function traders() {
      const r = edit?.type === "traderTx" ? (st().traderTx || []).find(x => x.id === edit.id) || {} : {};
      const search = r.name || sessionStorage.traderSearch || "";
      const list = fl(st().traderTx || []);
      const filteredList = list.filter(x => !search || String(x.name).toLowerCase().includes(search.toLowerCase()));
      const balance = search ? traderBalance(search) : { opening: 0, movement: 0, closing: 0 };
      const storeBalance = storeTraderBalance();

      return `
        <h2>التجار</h2>
        <datalist id="tn">${(data.traders || []).map(x => `<option value="${x}">`).join("")}</datalist>

        ${isAdmin ? `
          <div class="grid">
            <label>اسم التاجر <input id="trn" list="tn" value="${search}" oninput="showTraderLiveBalance(this.value); filterTraderTransactions(this.value)" onchange="sessionStorage.traderSearch=this.value; draw()"></label>
            <label>التاريخ ${dateBox("trd", r.date || rememberedDate("trd"))}</label>
            <label>النوع
              <select id="trk">
                <option value="invoice">فاتورة</option>
                <option value="payment" ${r.kind === "payment" ? "selected" : ""}>دفعة</option>
                <option value="return" ${r.kind === "return" ? "selected" : ""}>مرتجع</option>
              </select>
            </label>
            <label>القيمة <input id="tra" type="number" step="0.01" value="${r.amount || ""}"></label>
          </div>
          <div class="row">
            <button onclick="saveTrader()">${r.id ? "تعديل" : "حفظ"}</button>
            <button onclick="exportTraderTransactionsPdf()">تصدير معاملات التجار PDF</button>
          </div>
        ` : `
          <div class="row">
            <label>بحث باسم التاجر <input id="trn" list="tn" value="${search}" oninput="showTraderLiveBalance(this.value); filterTraderTransactions(this.value)"></label>
            <button onclick="exportTraderTransactionsPdf()">تصدير معاملات التجار PDF</button>
          </div>
        `}

        <div class="cards">
          <div class="card" id="liveTraderBalance">
            الرصيد السابق <strong>${m(balance.opening)}</strong>
            المعاملات <strong>${m(balance.movement)}</strong>
            الرصيد الحالي <strong>${m(balance.closing)}</strong>
          </div>
          <div class="card">مديونية المحل <strong>${m(storeBalance)}</strong></div>
        </div>

        <hr>
        <div class="row"><button class="gray" onclick="box('traderMonthList')">معاملات الشهر</button></div>

        <div id="traderMonthList" style="display:none">
          <div class="table-scroll">
            <table>
              <tr><th>التاريخ</th><th>التاجر</th><th>النوع</th><th>القيمة</th>${isAdmin ? "<th>تحكم</th>" : ""}</tr>
              <tbody id="traderTransactionRows">
                ${filteredList.map(x => `
                  <tr>
                    <td>${x.date}</td><td>${x.name}</td><td>${traderKindLabel(x.kind)}</td><td>${m(x.amount)}</td>
                    ${isAdmin ? `<td><button class="light" onclick="edt('traderTx','${x.id}')">تعديل</button><button class="danger" onclick="del('traderTx','${x.id}')">حذف</button></td>` : ""}
                  </tr>
                `).join("") || `<tr><td colspan="${isAdmin ? 5 : 4}">لا توجد معاملات</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function saveTrader() {
      if (!isAdmin) return;
      const name = trn.value.trim();
      if (!name) return alert("اكتب اسم التاجر");
      data.traders ||= [];
      if (!data.traders.includes(name)) data.traders.push(name);
      data.traders.sort();
      up(st().traderTx, {
        id: edit?.type === "traderTx" ? edit.id : id(),
        name, date: dateValue("trd"), kind: trk.value, amount: n(tra.value)
      });
    }

    function exportTraderTransactionsPdf() {
      if (tab !== "traders") return;
      const search = (sessionStorage.traderSearch || "").trim().toLowerCase();
      const rows = fl(st().traderTx || []).filter(x => !search || String(x.name).toLowerCase().includes(search)).sort((a, b) => String(a.date).localeCompare(String(b.date)));
      const invoices = rows.filter(x => x.kind === "invoice").reduce((s, x) => s + n(x.amount), 0);
      const payments = rows.filter(x => x.kind === "payment").reduce((s, x) => s + n(x.amount), 0);
      const returns = rows.filter(x => x.kind === "return").reduce((s, x) => s + n(x.amount), 0);
      const title = search ? `معاملات التاجر - ${sessionStorage.traderSearch}` : "معاملات التجار";
      const content = `
        <div class="summary-grid">
          <div class="metric">عدد المعاملات<b>${rows.length}</b></div>
          <div class="metric">إجمالي الفواتير<b>${m(invoices)}</b></div>
          <div class="metric">إجمالي الدفعات<b>${m(payments)}</b></div>
          <div class="metric">إجمالي المرتجعات<b>${m(returns)}</b></div>
        </div>
        <table><thead><tr><th>#</th><th>التاريخ</th><th>التاجر</th><th>النوع</th><th>القيمة</th></tr></thead><tbody>
          ${rows.map((x, i) => `<tr><td>${i + 1}</td><td>${x.date}</td><td>${x.name}</td><td>${traderKindLabel(x.kind)}</td><td>${m(x.amount)}</td></tr>`).join("") || `<tr><td colspan="5">لا توجد معاملات</td></tr>`}
        </tbody></table>`;
      printPdf(`${title} - ${meta()[1]}`, `الفترة: من ${period.from} إلى ${period.to}`, content);
    }

    /* =========================================================
       شيت البائعين
       ========================================================= */
    function sellers() {
      const shop = st();
      const sellers = shop.sellers || [];
      const fixedSellers = shop.fixedSellers || [];

      return `
        <h2>البائعين</h2>
        <h3>بائعين العمولة</h3>
        ${isAdmin ? `
          <div class="grid grid3">
            <label>اسم البائع <input id="sn"></label>
            <button onclick="addSeller()">إضافة بائع</button>
          </div>
        ` : ""}

        <div class="table-scroll">
          <table>
            <tr><th>البائع</th>${isAdmin ? "<th>تحكم</th>" : ""}</tr>
            ${sellers.map(x => `<tr><td>${x.name}</td>${isAdmin ? `<td><button class="danger" onclick="deleteSeller('${x.id}')">حذف</button></td>` : ""}</tr>`).join("") || `<tr><td colspan="${isAdmin ? 2 : 1}">لا يوجد بائعين</td></tr>`}
          </table>
        </div>

        <hr>
        <h3>راتب ثابت</h3>
        ${isAdmin ? `
          <div class="grid grid3">
            <label>الأسم <input id="fsn"></label>
            <label>الراتب الثابت <input id="fss" type="number" step="0.01"></label>
            <button onclick="addFixedSeller()">إضافة</button>
          </div>
        ` : ""}

        <div class="table-scroll">
          <table>
            <tr><th>الأسم</th><th>الراتب</th>${isAdmin ? "<th>تحكم</th>" : ""}</tr>
            ${fixedSellers.map(x => `<tr><td>${x.name}</td><td>${m(x.salary)}</td>${isAdmin ? `<td><button class="danger" onclick="deleteFixedSeller('${x.id}')">حذف</button></td>` : ""}</tr>`).join("") || `<tr><td colspan="${isAdmin ? 3 : 2}">لا يوجد بيانات</td></tr>`}
          </table>
        </div>
      `;
    }

    function addSeller() {
      if (!isAdmin) return;
      if (!sn.value.trim()) return;
      st().sellers.push({ id: id(), name: sn.value.trim() });
      save(); draw();
    }

    function deleteSeller(sellerId) {
      if (!isAdmin) return;
      if (!confirm("حذف البائع؟")) return;
      st().sellers = st().sellers.filter(x => x.id !== sellerId);
      save(); draw();
    }

    function addFixedSeller() {
      if (!isAdmin) return;
      if (!fsn.value.trim()) return;
      st().fixedSellers.push({ id: id(), name: fsn.value.trim(), salary: n(fss.value) });
      save(); draw();
    }

    function deleteFixedSeller(sellerId) {
      if (!isAdmin) return;
      if (!confirm("حذف ؟")) return;
      st().fixedSellers = st().fixedSellers.filter(x => x.id !== sellerId);
      save(); draw();
    }

    /* =========================================================
       شيت الأصناف
       ========================================================= */
    function itemStats(from, to) {
      const rows = {};
      (st().items || []).filter(x => x.date && (!from || x.date >= from) && (!to || x.date <= to)).forEach(x => {
        rows[x.name] ??= { qty: 0, value: 0 };
        rows[x.name].qty += n(x.qty);
        rows[x.name].value += n(x.value);
      });
      const list = Object.entries(rows).map(([name, value]) => ({ name, qty: value.qty, value: value.value })).sort((a, b) => b.qty - a.qty);
      const totalQty = list.reduce((sum, x) => sum + x.qty, 0);
      const totalValue = list.reduce((sum, x) => sum + x.value, 0);
      return { list, totalQty, totalValue };
    }

    function itemNames() {
      return [...new Set((st().items || []).map(x => x.name).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ar"));
    }

    function pieChart(stats) {
      if (!stats.totalQty) return `<div class="card">لا توجد أصناف في الفترة المحددة</div>`;
      const colors = ["#f97316", "#111214", "#b91c1c", "#6b7078", "#9ca3af", "#c2410c", "#404348", "#f59e0b"];
      let current = 0;
      const circles = stats.list.map((x, index) => {
        const percent = x.qty / stats.totalQty;
        const dash = percent * 100;
        const circle = `<circle r="15.9155" cx="18" cy="18" fill="transparent" stroke="${colors[index % colors.length]}" stroke-width="7" stroke-dasharray="${dash} ${100 - dash}" stroke-dashoffset="${25 - current}"></circle>`;
        current += dash;
        return circle;
      }).join("");
      return `
        <div class="chart-wrap">
          <div>
            <svg class="pie-svg" viewBox="0 0 36 36">
              <circle r="15.9155" cx="18" cy="18" fill="transparent" stroke="#e5e7eb" stroke-width="8"></circle>
              ${circles}
            </svg>
          </div>
          <div>
            ${stats.list.map((x, index) => `
              <div class="legend-row">
                <span class="legend-dot" style="background:${colors[index % colors.length]}"></span>
                <span>${x.name} - ${m(x.qty)} قطعة</span>
                <strong>${m((x.qty / stats.totalQty) * 100)}%</strong>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function compareChart(aStats, bStats) {
      const names = new Set([...aStats.list.map(x => x.name), ...bStats.list.map(x => x.name)]);
      const aMap = Object.fromEntries(aStats.list.map(x => [x.name, x]));
      const bMap = Object.fromEntries(bStats.list.map(x => [x.name, x]));
      const rows = [...names].sort((a, b) => a.localeCompare(b, "ar"));
      const maxQty = Math.max(1, ...rows.map(name => Math.max(n(aMap[name]?.qty), n(bMap[name]?.qty))));
      if (!rows.length) return `<div class="card">لا توجد بيانات للمقارنة</div>`;
      return `
        <div class="bar-chart">
          ${rows.map(name => {
            const aq = n(aMap[name]?.qty);
            const bq = n(bMap[name]?.qty);
            return `
              <div class="bar-row">
                <div class="bar-name">${name}</div>
                <div class="bar-track">
                  <div class="bar-line" style="width:${Math.max(3, (aq / maxQty) * 100)}%;background:#f97316">الأولى: ${m(aq)}</div>
                  <div class="bar-line" style="width:${Math.max(3, (bq / maxQty) * 100)}%;background:#111214">الثانية: ${m(bq)}</div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function itemStatsTable(stats) {
      return `
        <div class="table-scroll">
          <table>
            <tr><th>الصنف</th><th>عدد القطع</th><th>النسبة</th><th>سعر القطع المباعة</th></tr>
            ${stats.list.map(x => `<tr><td>${x.name}</td><td>${m(x.qty)}</td><td>${stats.totalQty ? m((x.qty / stats.totalQty) * 100) : 0}%</td><td>${m(x.value)}</td></tr>`).join("") || `<tr><td colspan="4">لا توجد بيانات</td></tr>`}
          </table>
        </div>
      `;
    }

    function items() {
      const r = edit?.type === "items" ? (st().items || []).find(x => x.id === edit.id) || {} : {};
      const mainStats = itemStats(period.from, period.to);
      const aFrom = sessionStorage.itemsAFrom || period.from;
      const aTo = sessionStorage.itemsATo || period.to;
      const bFrom = sessionStorage.itemsBFrom || period.from;
      const bTo = sessionStorage.itemsBTo || period.to;
      const aStats = itemStats(aFrom, aTo);
      const bStats = itemStats(bFrom, bTo);

      return `
        <h2>تقرير الأصناف</h2>
        <datalist id="itemNameList">${itemNames().map(name => `<option value="${name}">`).join("")}</datalist>

        ${isAdmin ? `
          <div class="grid">
            <label>التاريخ ${dateBox("itd", r.date || rememberedDate("itd"))}</label>
            <label>اسم الصنف <input id="itn" list="itemNameList" value="${r.name || ""}" placeholder="اكتب أول حرف"></label>
            <label>عدد القطع المباعة <input id="itq" type="number" step="0.01" value="${r.qty || ""}"></label>
            <label>سعر القطع المباعة <input id="itv" type="number" step="0.01" value="${r.value || ""}"></label>
            <button onclick="saveItem()">${r.id ? "تعديل الصنف" : "إضافة صنف"}</button>
            ${r.id ? `<button class="light" onclick="edit=null; draw()">إلغاء التعديل</button>` : ""}
          </div>
          <div class="row"><button class="gray" onclick="box('itemsList')">عرض / إخفاء الأصناف المسجلة</button></div>
        ` : `
          <div class="row"><button class="gray" onclick="box('itemsList')">عرض / إخفاء الأصناف المسجلة</button></div>
        `}

        <div id="itemsList" style="display:none">
          <div class="table-scroll">
            ${table(fl(st().items || []), "items", ["التاريخ", "الصنف", "عدد القطع", "سعر القطع"], x => [x.date, x.name, m(x.qty), m(x.value)])}
          </div>
        </div>

        <hr>
        <h3>الرسم البياني للفترة المحددة فوق</h3>
        <div class="cards">
          <div class="card">إجمالي القطع <strong>${m(mainStats.totalQty)}</strong></div>
          <div class="card">إجمالي سعر القطع <strong>${m(mainStats.totalValue)}</strong></div>
        </div>
        ${pieChart(mainStats)}
        ${itemStatsTable(mainStats)}

        <hr>
        <h3>مقارنة بين فترتين</h3>
        <div class="grid">
          <label>الفترة الأولى من ${dateBox("iaf", aFrom)}</label>
          <label>الفترة الأولى إلى ${dateBox("iat", aTo)}</label>
          <label>الفترة الثانية من ${dateBox("ibf", bFrom)}</label>
          <label>الفترة الثانية إلى ${dateBox("ibt", bTo)}</label>
          <button onclick="setItemCompare()">تطبيق المقارنة</button>
        </div>

        <div class="cards">
          <div class="card">قطع الفترة الأولى <strong>${m(aStats.totalQty)}</strong></div>
          <div class="card">قيمة الفترة الأولى <strong>${m(aStats.totalValue)}</strong></div>
          <div class="card">قطع الفترة الثانية <strong>${m(bStats.totalQty)}</strong></div>
          <div class="card">قيمة الفترة الثانية <strong>${m(bStats.totalValue)}</strong></div>
        </div>

        ${compareChart(aStats, bStats)}

        <div class="table-scroll">
          <table>
            <tr><th>الصنف</th><th>قطع الفترة الأولى</th><th>قطع الفترة الثانية</th><th>الفرق</th><th>قيمة الأولى</th><th>قيمة الثانية</th></tr>
            ${itemCompareRows(aStats, bStats)}
          </table>
        </div>
      `;
    }

    function saveItem() {
      if (!isAdmin) return;
      if (!itn.value.trim()) return alert("اكتب اسم الصنف");
      up(st().items, {
        id: edit?.type === "items" ? edit.id : id(),
        date: dateValue("itd"),
        name: itn.value.trim(),
        qty: n(itq.value),
        value: n(itv.value)
      });
    }

    function setItemCompare() {
      sessionStorage.itemsAFrom = dateValue("iaf");
      sessionStorage.itemsATo = dateValue("iat");
      sessionStorage.itemsBFrom = dateValue("ibf");
      sessionStorage.itemsBTo = dateValue("ibt");
      draw();
    }

    function itemCompareRows(aStats, bStats) {
      const names = new Set([...aStats.list.map(x => x.name), ...bStats.list.map(x => x.name)]);
      const aMap = Object.fromEntries(aStats.list.map(x => [x.name, x]));
      const bMap = Object.fromEntries(bStats.list.map(x => [x.name, x]));
      return [...names].sort((a, b) => a.localeCompare(b, "ar")).map(name => {
        const a = aMap[name] || { qty: 0, value: 0 };
        const b = bMap[name] || { qty: 0, value: 0 };
        return `<tr><td>${name}</td><td>${m(a.qty)}</td><td>${m(b.qty)}</td><td>${m(b.qty - a.qty)}</td><td>${m(a.value)}</td><td>${m(b.value)}</td></tr>`;
      }).join("") || `<tr><td colspan="6">لا توجد بيانات للمقارنة</td></tr>`;
    }

    /* =========================================================
       شيت المصروفات
       ========================================================= */
    function expenses() {
      const shop = st();
      const expenseRecord = edit?.type === "expenses" ? (shop.expenses || []).find(x => x.id === edit.id) || {} : {};
      const withdrawalRecord = edit?.type === "withdrawals" ? (shop.withdrawals || []).find(x => x.id === edit.id) || {} : {};
      const expenseList = fl(shop.expenses || []);
      const withdrawalList = fl(shop.withdrawals || []);
      const traderPaymentList = fl(shop.traderTx || []).filter(x => x.kind === "payment");
      const unifiedList = unifiedOutflows();
      const allSellers = [
        ...(shop.sellers || []).map(s => ({ name: s.name, type: "عمولة" })),
        ...(shop.fixedSellers || []).map(s => ({ name: s.name, type: "راتب ثابت" }))
      ];

      return `
        <h2>المصروفات والمسحوبات</h2>
        <div class="card">إجمالي المصروفات <strong>${m(unifiedOutflowTotal())}</strong></div>

        <h3>مصروفات المحل</h3>
        ${isAdmin ? `
          <div class="grid">
            <label>التاريخ ${dateBox("xd", expenseRecord.date || rememberedDate("xd"))}</label>
            <label>البند <input id="xi" value="${expenseRecord.item || ""}"></label>
            <label>القيمة <input id="xa" type="number" step="0.01" value="${expenseRecord.amount || ""}"></label>
            <button onclick="saveExpense()">حفظ</button>
          </div>
        ` : ""}

        <div class="row">
          <button class="gray" onclick="box('explist')">المصروفات</button>
          <div class="card">الإجمالي <strong>${m(expenseList.reduce((s, x) => s + n(x.amount), 0))}</strong></div>
        </div>

        <div id="explist" style="display:none">
          <div class="table-scroll">
            ${table(expenseList, "expenses", ["التاريخ", "البند", "القيمة"], x => [x.date, x.item, m(x.amount)])}
          </div>
        </div>

        <hr>
        <h3>كشف المصروفات</h3>
        <p>التفاصيل الكاملة للمصروفات</p>
        <div class="row">
          <button class="gray" onclick="box('unifiedlist')">التفاصيل</button>
          <button onclick="exportExpensesPdf()">PDF</button>
          <div class="card">مصروفات كاش <strong>${m(expenseList.reduce((s, x) => s + n(x.amount), 0))}</strong></div>
          <div class="card">دفعات التجار <strong>${m(traderPaymentList.reduce((s, x) => s + n(x.amount), 0))}</strong></div>
          <div class="card">مسحوبات البائعين <strong>${m(withdrawalList.reduce((s, x) => s + n(x.amount), 0))}</strong></div>
        </div>
        <div id="unifiedlist" style="display:none">
          <div class="table-scroll">
            <table>
              <tr><th>التاريخ</th><th>البند</th><th>النوع</th><th>القيمة</th><th>المصدر</th>${isAdmin ? "<th>تعديل</th>" : ""}</tr>
              ${unifiedList.map(x => `
                <tr>
                  <td>${x.date}</td><td>${x.item}</td><td>${x.type}</td><td>${m(x.amount)}</td>
                  <td>${x.source === "expenses" ? "المصروفات" : x.source === "traderTx" ? "التجار" : "مسحوبات البائعين"}</td>
                  ${isAdmin ? `<td><button class="light" onclick="edt('${x.source}','${x.id}')">تعديل</button><button class="danger" onclick="del('${x.source}','${x.id}')">حذف</button></td>` : ""}
                </tr>
              `).join("") || `<tr><td colspan="${isAdmin ? 6 : 5}">لا توجد عمليات خلال الفترة</td></tr>`}
            </table>
          </div>
        </div>

        <hr>
        <h3>مسحوبات البائعين</h3>
        ${isAdmin ? `
          <div class="grid">
            <label>التاريخ ${dateBox("wd", withdrawalRecord.date || rememberedDate("wd"))}</label>
            <label>البائع
              <select id="ws">
                ${allSellers.map(s => `<option value="${s.name}" ${withdrawalRecord.seller === s.name ? "selected" : ""}>${s.name} - ${s.type}</option>`).join("")}
              </select>
            </label>
            <label>القيمة <input id="wa" type="number" step="0.01" value="${withdrawalRecord.amount || ""}"></label>
            <button onclick="saveWithdrawal()">حفظ</button>
          </div>
        ` : ""}

        <div class="row">
          <button class="gray" onclick="box('wdlist')">المسحوبات</button>
          <div class="card">الإجمالي <strong>${m(withdrawalList.reduce((s, x) => s + n(x.amount), 0))}</strong></div>
        </div>
